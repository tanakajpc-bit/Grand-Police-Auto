<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>PERÍMETRO</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&family=Playfair+Display:wght@700;800;900&display=swap">
<style>
/* Layout: central de comando escura, modular. Acento âmbar = alerta, azul = controle, vermelho = perigo, verde = positivo. */
:root{
  --bg:#0a101a; --bg2:#0f1726; --panel:#131d2f; --panel2:#1a2639; --line:#27374f; --line2:#374c6c;
  --ink:#e8edf5; --ink2:#aab7cb; --ink3:#8696af;
  --amber:#f6a623; --orange:#ff7b2e; --red:#ff5468; --blue:#4da6ff; --green:#41d08f; --violet:#a78bfa;
  --amber-bg:rgba(246,166,35,.12); --red-bg:rgba(255,84,104,.13); --blue-bg:rgba(77,166,255,.12); --green-bg:rgba(65,208,143,.12);
  --paper:#ece5d3; --paper2:#e2d9c2; --paperink:#1d1a14; --paperink2:#4a4538;
  --serif:'Newsreader',Georgia,'Times New Roman',serif;
  --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --cond:'IBM Plex Sans Condensed','IBM Plex Sans',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --disp:'Playfair Display',Georgia,serif;
  --r:10px; --r2:6px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px;min-height:100vh;
  background-image:radial-gradient(1200px 600px at 70% -10%,rgba(77,166,255,.07),transparent 60%),radial-gradient(900px 500px at -10% 110%,rgba(246,166,35,.05),transparent 60%);}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:60}
h1,h2,h3,h4{margin:0;font-weight:600;line-height:1.2;text-wrap:balance}
p{margin:0}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#app{max-width:1560px;margin:0 auto;position:relative}
.screen{animation:fadein .5s ease both}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink2)} .faint{color:var(--ink3)}
.eyebrow{font-family:var(--cond);text-transform:uppercase;letter-spacing:.16em;font-size:12px;color:var(--ink3);font-weight:600}
.serif{font-family:var(--serif)}

/* botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border-radius:8px;border:1px solid var(--line2);background:var(--panel2);cursor:pointer;font-weight:600;transition:transform .12s,background .15s,border-color .15s,box-shadow .15s}
.btn:hover{background:#22314a;border-color:#4a6288}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.btn[aria-disabled=true]{background:transparent;border-style:dashed;border-color:var(--line2);color:var(--ink2);cursor:not-allowed;transform:none;box-shadow:none}
.btn.primary{background:var(--amber);border-color:var(--amber);color:#1b1305}
.btn.primary:hover{background:#ffb93d;box-shadow:0 0 0 4px rgba(246,166,35,.18)}
.btn.blue{background:var(--blue);border-color:var(--blue);color:#06162a}
.btn.blue:hover{background:#74b9ff}
.btn.danger{background:var(--red-bg);border-color:var(--red);color:#ffb3bc}
.btn.danger:hover{background:rgba(255,84,104,.25)}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 11px;font-size:12.5px;border-radius:6px}
.btn.lg{padding:14px 26px;font-size:16px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid var(--line2);background:var(--panel2);color:var(--ink2);white-space:nowrap}
.pill.amber{color:var(--amber);border-color:rgba(246,166,35,.5);background:var(--amber-bg)}
.pill.red{color:#ff9aa7;border-color:rgba(255,84,104,.5);background:var(--red-bg)}
.pill.green{color:var(--green);border-color:rgba(65,208,143,.45);background:var(--green-bg)}
.pill.blue{color:var(--blue);border-color:rgba(77,166,255,.45);background:var(--blue-bg)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card.flat{background:var(--bg2)}
.card h3,.h3{font-size:13px;font-family:var(--cond);text-transform:uppercase;letter-spacing:.12em;color:var(--ink2);font-weight:600;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.card h3 .sub,.h3 .sub{text-transform:none;letter-spacing:0;font-family:var(--sans);font-size:12px;font-weight:400;text-align:right}
.card h3 .pill,.h3 .pill{text-transform:none;letter-spacing:0;font-family:var(--sans)}
.grid{display:grid;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}

/* medidores */
.meter{height:8px;background:#0b1320;border:1px solid var(--line);border-radius:99px;overflow:hidden;position:relative}
.meter>i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--blue);transition:width .9s cubic-bezier(.2,.8,.2,1),background .4s}
.meter.g>i{background:var(--green)} .meter.a>i{background:var(--amber)} .meter.r>i{background:var(--red)} .meter.b>i{background:var(--blue)} .meter.v>i{background:var(--violet)}
.meter.tall{height:12px}
.meter .mk{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink2);opacity:.7}
.mrow{display:grid;grid-template-columns:104px 1fr 44px;gap:10px;align-items:center;font-size:12.5px}
.mrow .lab{color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow .val{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ===== MENU ===== */
.menu{display:grid;grid-template-rows:auto 1fr;min-height:calc(100vh - 20px);position:relative}
.sky{position:relative;height:min(46vh,430px);margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));overflow:hidden;background:linear-gradient(180deg,#05080f 0%,#0b1426 55%,#16233b 100%);border-bottom:1px solid var(--line)}
.sky svg.skyline{position:absolute;left:0;right:0;bottom:0;width:100%;height:78%}
.sky .win{animation:flick 6s infinite}
@keyframes flick{0%,92%,100%{opacity:1}94%{opacity:.25}96%{opacity:.9}}
.siren{position:absolute;bottom:22px;width:140px;height:70px;border-radius:50%;filter:blur(18px);opacity:.0;animation:siren 1.4s infinite}
.siren.r{left:18%;background:#ff3b4f;box-shadow:0 0 90px 40px rgba(255,59,79,.55)}
.siren.b{left:calc(18% + 120px);background:#2f7bff;box-shadow:0 0 90px 40px rgba(47,123,255,.55);animation-delay:.7s}
.siren.r2{right:22%;background:#ff3b4f;box-shadow:0 0 90px 40px rgba(255,59,79,.55);animation-delay:.35s}
.siren.b2{right:calc(22% + 120px);background:#2f7bff;box-shadow:0 0 90px 40px rgba(47,123,255,.55);animation-delay:1.05s}
@keyframes siren{0%,100%{opacity:0}12%{opacity:.85}30%{opacity:0}}
.titleblock{position:absolute;left:0;right:0;top:50%;transform:translateY(-58%);text-align:center;padding:0 16px}
.titleblock h1{font-family:var(--cond);font-weight:700;font-size:clamp(46px,9vw,120px);letter-spacing:.34em;margin-right:-.34em;line-height:1;text-shadow:0 0 40px rgba(77,166,255,.35)}
.titleblock .sub{margin-top:14px;font-family:var(--serif);font-style:italic;font-size:clamp(15px,2vw,21px);color:var(--ink2)}
.titleblock .clock{font-family:var(--mono);color:var(--amber);letter-spacing:.2em;font-size:13px;margin-bottom:14px}
.menubody{display:grid;grid-template-columns:1.25fr 1fr;gap:22px;padding-top:22px;max-width:1180px;margin:0 auto;width:100%;align-items:start}
.diffs{display:grid;gap:10px}
.diffcard{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;text-align:left;width:100%;padding:14px 16px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);cursor:pointer;transition:border-color .15s,background .15s,transform .12s}
.diffcard:hover{border-color:var(--line2);background:var(--panel2)}
.diffcard:active{transform:scale(.99)}
.diffcard[aria-checked=true]{border-color:var(--amber);background:var(--amber-bg)}
.diffcard .dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--ink3)}
.diffcard[aria-checked=true] .dot{border-color:var(--amber);background:var(--amber);box-shadow:0 0 0 3px rgba(246,166,35,.2)}
.diffcard .dname{font-size:16px;display:block}
.diffcard .dblurb{font-size:13px;color:var(--ink2);margin-top:2px;display:block}
.dparams{font-family:var(--mono);font-size:12px;color:var(--ink3);text-align:right;line-height:1.5}

/* ===== BRIEFING ===== */
.brief{max-width:860px;margin:0 auto;padding-top:30px}
.brief .time{font-family:var(--mono);font-size:clamp(44px,8vw,84px);color:var(--amber);letter-spacing:.04em;line-height:1}
.brief .day{font-family:var(--cond);text-transform:uppercase;letter-spacing:.3em;color:var(--ink3);font-size:13px;margin-bottom:6px}
.brief .narr{font-family:var(--serif);font-size:clamp(18px,2.1vw,23px);line-height:1.62;margin-top:22px;color:#dfe6f1}
.brief .narr p{margin-bottom:16px;opacity:0;animation:rise .9s ease forwards}
.brief .narr p:nth-child(1){animation-delay:.3s}.brief .narr p:nth-child(2){animation-delay:1.5s}.brief .narr p:nth-child(3){animation-delay:2.7s}
.brief .after{opacity:0;animation:rise .9s ease 3.7s forwards}
.brief{cursor:default}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.noanim .brief .narr p,.noanim .brief .after{opacity:1;animation:none}
.objgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:22px}
.obj{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px;position:relative;overflow:hidden}
.obj b{display:block;font-family:var(--mono);font-size:26px;color:var(--amber)}
.obj span{font-size:12.5px;color:var(--ink2)}
.obj::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--blue);width:var(--w)}

/* ===== TOPBAR / HUD ===== */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:10px max(16px,env(safe-area-inset-left,0px));background:rgba(10,16,26,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hudrow{display:flex;gap:18px;align-items:center;flex-wrap:wrap;max-width:1560px;margin:0 auto}
.brand{font-family:var(--cond);letter-spacing:.3em;font-weight:700;font-size:15px}
.stat{display:flex;flex-direction:column;line-height:1.15}
.stat small{font-family:var(--cond);text-transform:uppercase;letter-spacing:.12em;font-size:11px;color:var(--ink3)}
.stat b{font-family:var(--mono);font-size:18px;font-variant-numeric:tabular-nums}
.timer{font-family:var(--mono);font-size:22px;font-weight:600;padding:4px 12px;border-radius:8px;border:1px solid var(--line2);background:var(--panel)}
.timer.low{color:var(--red);border-color:var(--red);animation:blink .9s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
.bsc{display:grid;grid-template-columns:repeat(5,minmax(70px,1fr));gap:10px;flex:1;min-width:320px}
.bsc>div{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:6px;font-size:11px;font-family:var(--cond);text-transform:uppercase;letter-spacing:.1em;color:var(--ink3)}
.bsc>div>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bsc>div .meter{margin-top:4px;height:6px;grid-column:1/-1}
.bsc>div b{font-family:var(--mono);color:var(--ink2);font-size:12px;letter-spacing:0;border-radius:3px}
.edge{position:fixed;inset:0;pointer-events:none;z-index:50;box-shadow:inset 0 0 0 0 rgba(255,84,104,0);transition:box-shadow .6s}
.edge.hot{animation:edge 1.6s ease-in-out infinite}
@keyframes edge{0%,100%{box-shadow:inset 0 0 60px 6px rgba(255,84,104,.12)}50%{box-shadow:inset 0 0 120px 18px rgba(255,84,104,.34)}}

/* ===== RECRUTAMENTO ===== */
.recr{display:grid;grid-template-columns:1fr 330px;gap:18px;padding-top:18px;align-items:start}
.agents{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.acard{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:9px;cursor:pointer;text-align:left;transition:transform .15s,border-color .15s,box-shadow .2s;position:relative;width:100%}
.acard:hover{border-color:var(--line2);transform:translateY(-2px)}
.acard[aria-pressed=true]{border-color:var(--green);box-shadow:0 0 0 1px var(--green),0 8px 26px rgba(65,208,143,.12)}
.acard[aria-disabled=true]{opacity:.72;border-style:dashed;cursor:not-allowed;background:var(--bg2)}
.acard[aria-disabled=true]:hover{transform:none;border-color:var(--line2)}
.acard .top{display:grid;grid-template-columns:54px 1fr auto;gap:10px;align-items:center}
.sil{width:54px;height:62px;border-radius:8px;background:linear-gradient(160deg,#1f3150,#0e1626);border:1px solid var(--line);display:grid;place-items:end center;overflow:hidden}
.acard .an{font-size:14px;display:block;line-height:1.25}
.acard .cost{font-family:var(--mono);color:var(--amber);font-weight:600}
.attrs{display:grid;gap:4px}
.attr{display:grid;grid-template-columns:84px 1fr 20px;gap:7px;align-items:center;font-size:12px;color:var(--ink2)}
.attr .meter{height:6px}
.attr b{font-family:var(--mono);text-align:right;color:var(--ink)}
.trait{font-size:12px;line-height:1.4;color:var(--ink2);background:#0d1523;border:1px solid var(--line);border-radius:6px;padding:6px 8px}
.trait b{color:var(--amber);font-family:var(--cond);letter-spacing:.06em;text-transform:uppercase;font-size:11.5px;display:block}
.hired{position:absolute;top:8px;right:8px}
.side{position:sticky;top:78px;display:grid;gap:12px;max-height:calc(100vh - 186px);overflow:auto;overscroll-behavior:contain;padding-right:2px;scrollbar-width:thin}
.credits{font-family:var(--mono);font-size:38px;font-weight:600;color:var(--amber);line-height:1}
.gear{display:grid;gap:8px}
.gcard{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:9px 10px;background:var(--panel);border:1px solid var(--line);border-radius:8px;cursor:pointer;text-align:left;width:100%;transition:border-color .15s,background .15s}
.gcard:hover{border-color:var(--line2);background:var(--panel2)}
.gcard[aria-pressed=true]{border-color:var(--green);background:var(--green-bg)}
.gcard[aria-disabled=true]{opacity:.72;border-style:dashed;cursor:not-allowed;background:var(--bg2)}
.gcard b{font-size:13.5px;display:block}.gcard span{font-size:12px;color:var(--ink2);line-height:1.35;display:block}
.gcard .cost{color:var(--amber);font-weight:600}
.ico{width:30px;height:30px;color:var(--blue)}
.mini{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;padding:4px 0;border-bottom:1px dashed var(--line)}

/* ===== MAPA / PERÍMETRO ===== */
.perim{display:grid;grid-template-columns:1fr 360px;gap:18px;padding-top:18px;align-items:start}
.mapwrap{background:radial-gradient(600px 300px at 50% 40%,#12203a,#0b1322);border:1px solid var(--line);border-radius:12px;padding:8px;position:relative}
svg.map{width:100%;height:auto;display:block}
.zone rect.z{stroke-width:2;transition:fill .5s,stroke .3s}
.zone{cursor:pointer;outline:none}
.zone:hover rect.z{stroke:var(--ink)}
.zone:focus-visible rect.z{stroke:#fff;stroke-width:3;stroke-dasharray:5 3}
.zone.sel rect.z{stroke:var(--blue);stroke-width:3.5;stroke-dasharray:none}
.zone.sel:focus-visible rect.z{stroke:#fff;stroke-dasharray:5 3}
.zone text{pointer-events:none;font-family:var(--sans)}
.legend{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:12px;color:var(--ink2);padding:8px 6px 2px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-2px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:99px;background:var(--panel2);border:1px solid var(--line2);font-size:12.5px;cursor:pointer;transition:border-color .15s,background .15s,transform .1s}
.chip:hover{border-color:var(--blue)}
.chip:active{transform:scale(.96)}
.chip[aria-pressed=true]{background:var(--blue-bg);border-color:var(--blue);color:#cfe6ff}
.chip .in{width:20px;height:20px;border-radius:50%;background:#26405f;display:grid;place-items:center;font-size:11px;font-weight:700}
.zlist{display:grid;gap:8px}
.zrow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:8px 10px;background:var(--bg2);border:1px solid var(--line);border-radius:8px}
.zrow.sel{border-color:var(--blue)}
.zrow .nm{font-weight:600;font-size:13px}
.zrow .cv{font-family:var(--mono);font-weight:600}
.zrow .chips{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;min-height:4px}
.intelgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;align-items:start}
.icard{padding:12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;display:grid;gap:6px;text-align:left}
.icard.done{border-color:var(--green);background:var(--green-bg)}
.icard b{font-size:13.5px}.icard p{font-size:12.5px;color:var(--ink2)}
.icard>.btn{justify-self:start}

/* ===== CERCO ===== */
.siege{display:grid;gap:14px;padding-top:14px;grid-template-columns:300px minmax(0,1fr) 380px;grid-template-areas:"A B C"}
.colA{grid-area:A;display:grid;gap:14px;align-content:start;min-width:0}
.colB{grid-area:B;display:grid;gap:14px;align-content:start;min-width:0}
.colC{grid-area:C;display:grid;gap:14px;align-content:start;min-width:0}
@media (max-width:1399px){.siege{grid-template-columns:minmax(0,1fr) 380px;grid-template-areas:"B C" "A A"}.siege .colA{display:block;columns:3 260px;column-gap:14px}.siege .colA>*{break-inside:avoid;margin-bottom:14px}}
.siege svg.map{max-width:760px;margin-inline:auto}
@media (max-width:820px){.siege{grid-template-columns:minmax(0,1fr);grid-template-areas:"C" "B" "A"}.recr,.perim,.menubody{grid-template-columns:1fr}.side{position:static}.objgrid{grid-template-columns:repeat(2,1fr)}.bsc{min-width:100%}}
.lvl{display:grid;gap:10px}
.lvl .tag{display:inline-flex;align-items:center;gap:8px;font-family:var(--cond);text-transform:uppercase;letter-spacing:.12em;font-size:11.5px;color:var(--ink2)}
.lvl .tag b{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--blue);color:#06162a;font-size:11px}
.l2 .tag b{background:var(--amber);color:#1b1305}.l3 .tag b{background:var(--violet);color:#150f2b}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.kv div{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.kv small{display:block;font-family:var(--cond);text-transform:uppercase;letter-spacing:.1em;font-size:11px;color:var(--ink3)}
.kv b{font-family:var(--mono);font-size:16px}
.kv .unk{color:var(--ink3);font-style:italic;font-family:var(--sans);font-size:13px}
.insight{display:grid;grid-template-columns:22px 1fr;gap:8px;font-size:13px;padding:8px 10px;border-radius:8px;background:var(--bg2);border:1px solid var(--line);line-height:1.4}
.insight.warn{border-color:rgba(246,166,35,.5);background:var(--amber-bg)}
.insight.bad{border-color:rgba(255,84,104,.5);background:var(--red-bg)}
.insight.good{border-color:rgba(65,208,143,.4);background:var(--green-bg)}
.insight.info{border-color:rgba(77,166,255,.4);background:var(--blue-bg)}
.insight svg{width:18px;height:18px;margin-top:1px}
.report{font-size:12.5px;display:grid;grid-template-columns:auto 1fr;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line)}
.report:last-child{border:0}
.report .src{font-family:var(--mono);font-size:11.5px;color:var(--amber);white-space:nowrap}
.radio{font-family:var(--mono);font-size:12px;color:#cdd8e8;display:grid;gap:6px;max-height:190px;overflow:auto;padding-right:4px}
.radio p{padding:6px 8px;border-left:3px solid var(--blue);background:#0d1523;border-radius:0 6px 6px 0}
.radio p.hot{border-color:var(--red)}.radio p.warn{border-color:var(--amber)}
.spark{width:100%;height:46px;display:block}
.stk{display:grid;gap:9px}
.stkrow{display:grid;grid-template-columns:92px 1fr 34px;gap:8px;align-items:center;font-size:12.5px}
.stkrow .nm{display:flex;flex-direction:column;line-height:1.15}
.stkrow .nm small{font-size:11px;color:var(--ink3)}
.stkrow .alert{color:var(--red)}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:4px}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 4px 6px;border-radius:7px;border:0;background:transparent;font-family:var(--cond);text-transform:uppercase;letter-spacing:.06em;font-size:12px;font-weight:600;color:var(--ink2);cursor:pointer;transition:background .15s,color .15s,transform .1s}
.tab .ico{width:16px;height:16px;color:currentColor}
.tab:active{transform:scale(.97)}
.tab:hover{background:var(--panel2);color:var(--ink)}
.tab[aria-selected=true]{background:var(--blue);color:#06162a}
.slots{display:flex;gap:6px;align-items:center}
.slot{width:26px;height:10px;border-radius:99px;background:#0b1320;border:1px solid var(--line2)}
.slot.on{background:var(--amber);border-color:var(--amber)}
.opt{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;padding:10px;border-radius:9px;background:var(--bg2);border:1px solid var(--line);cursor:pointer;text-align:left;width:100%;transition:border-color .15s,background .15s,transform .1s}
.opt:hover{border-color:var(--blue);background:var(--panel2)}
.opt:active{transform:scale(.985)}
.opt[disabled]{opacity:.42;cursor:not-allowed}
.opt[aria-disabled=true]{background:transparent;border-style:dashed;cursor:not-allowed}
.opt[aria-disabled=true]:hover{border-color:var(--line2);background:transparent}
.opt[aria-disabled=true]:active{transform:none}
.opt[aria-disabled=true] .ico{opacity:.6}.opt[aria-disabled=true] .c{color:var(--ink2)}
.opt[aria-disabled=true] b{color:var(--ink2)}
.opt[aria-disabled=true][aria-pressed=true]{border-style:solid;border-color:var(--amber);background:var(--amber-bg)}
.opt[aria-disabled=true][aria-pressed=true] b{color:var(--ink)}
.opt[aria-disabled=true][aria-pressed=true] .ico{opacity:1}
.opt[aria-pressed=true]{border-color:var(--amber);background:var(--amber-bg)}
.opt b{font-size:13.5px;display:block}.opt span.d{font-size:12.5px;color:var(--ink2);display:block;line-height:1.4}
.opt .c{font-family:var(--mono);font-size:13px;color:var(--amber);white-space:nowrap}
.opt.danger{border-color:rgba(255,84,104,.45)}
.optlist{display:grid;gap:7px}
.field{display:grid;gap:4px;font-size:12.5px;color:var(--ink2);min-width:0}
select{background:#0d1523;border:1px solid var(--line2);border-radius:7px;padding:7px 9px;color:var(--ink);max-width:100%;min-width:0;cursor:pointer;transition:border-color .15s}
.field select{width:100%}
select:hover{border-color:var(--blue)}
.queue{display:grid;gap:6px}
.qitem{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:7px 10px;background:var(--bg2);border:1px solid var(--line2);border-radius:8px;font-size:12.5px;animation:fadein .25s}
.ladder{display:grid;gap:5px}
.step{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg2);font-size:12.5px;transition:background .4s,border-color .4s}
.step b{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:#0b1320;border:1px solid var(--line2);font-family:var(--mono)}
.step.done{border-color:rgba(65,208,143,.4)}.step.done b{background:var(--green);color:#052b1a;border-color:var(--green)}
.step.cur{border-color:var(--amber);background:var(--amber-bg)}.step.cur b{background:var(--amber);color:#1b1305;border-color:var(--amber);animation:pulse 1.8s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(246,166,35,.5)}50%{box-shadow:0 0 0 7px rgba(246,166,35,0)}}
.step small{color:var(--ink3);font-size:12px}
.team{display:grid;gap:6px}
.trow{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center;padding:6px 8px;background:var(--bg2);border:1px solid var(--line);border-radius:8px;font-size:12.5px}
.trow small{color:var(--ink3);display:block;font-size:11.5px}
.trow.away{border-style:dashed;background:transparent}.trow.away b{color:var(--ink2)}

/* ===== RESOLUÇÃO / EVENTO ===== */
.resol{max-width:980px;margin:0 auto;padding-top:22px;display:grid;gap:16px}
.res-line{display:grid;grid-template-columns:26px 1fr;gap:10px;padding:10px 12px;border-radius:9px;background:var(--panel);border:1px solid var(--line);font-size:14px;animation:fadein .4s both}
.res-line.good{border-color:rgba(65,208,143,.4)}.res-line.bad{border-color:rgba(255,84,104,.45);background:var(--red-bg)}.res-line.warn{border-color:rgba(246,166,35,.45)}.res-line.insight{border-color:rgba(167,139,250,.5);background:rgba(167,139,250,.1)}
.res-line svg{width:20px;height:20px}
.delta{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.dcell{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.dcell .top{display:flex;justify-content:space-between;font-size:12px;color:var(--ink2);margin-bottom:6px}
.dcell .top b{font-family:var(--mono);color:var(--ink)}
.up{color:var(--amber)}.dn{color:var(--green)}
.modalback{position:fixed;inset:0;z-index:100;background:rgba(3,6,12,.82);display:grid;place-items:center;padding:20px;animation:fadein .3s}
.evcard{width:min(620px,100%);background:linear-gradient(180deg,#1b2740,#101827);border:1px solid var(--amber);border-radius:16px;padding:26px;display:grid;gap:14px;box-shadow:0 30px 90px rgba(0,0,0,.6),0 0 0 6px rgba(246,166,35,.08);max-height:92vh;overflow:auto}
.evcard .evico{width:60px;height:60px;border-radius:14px;background:var(--amber-bg);border:1px solid var(--amber);display:grid;place-items:center;color:var(--amber)}
.evcard .evico svg{width:34px;height:34px}
.evcard h2{font-family:var(--cond);letter-spacing:.14em;text-transform:uppercase;font-size:26px;color:var(--amber)}
.evcard .radio-q{font-family:var(--mono);font-size:13px;color:#cdd8e8;border-left:3px solid var(--red);padding-left:12px}
.evcard p.d{font-family:var(--serif);font-size:17px;line-height:1.55}
.tutor{width:min(720px,100%);background:var(--panel);border:1px solid var(--line2);border-radius:14px;padding:24px;max-height:90vh;overflow:auto;display:grid;gap:12px}
.tutor h3{font-size:18px}

/* toasts */
#toasts{position:fixed;left:max(14px,env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:90;display:grid;gap:8px;width:min(360px,calc(100vw - 28px));pointer-events:none;transition:bottom .2s}
body.withbar #toasts{bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.toast{position:relative;pointer-events:auto;background:#0c1424;border:1px solid var(--line2);border-left:4px solid var(--blue);border-radius:8px;padding:10px 34px 10px 12px;font-family:var(--mono);font-size:12.5px;color:#d6e0ef;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:toastin .35s both,toastout .4s 6.5s forwards}
.toast:hover{animation-play-state:paused}
.toast .tx{position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:6px;border:0;background:transparent;color:var(--ink3);cursor:pointer;font-size:12px;line-height:1}
.toast .tx:hover{background:var(--panel2);color:var(--ink)}
.toast.hot{border-left-color:var(--red)}.toast.warn{border-left-color:var(--amber)}.toast.good{border-left-color:var(--green)}
.toast b{display:block;color:var(--amber);font-size:11px;letter-spacing:.14em;margin-bottom:2px}
@keyframes toastin{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
@keyframes toastout{to{opacity:0;transform:translateX(-24px)}}

/* ===== DESFECHO ===== */
.outcome{max-width:900px;margin:0 auto;padding-top:34px;display:grid;gap:20px}
.outcome h1{font-family:var(--disp);font-weight:800;font-size:clamp(30px,5vw,54px);line-height:1.08}
.outcome .narr{font-family:var(--serif);font-size:clamp(18px,2vw,22px);line-height:1.65;color:#dfe6f1}
.outcome .narr p{margin-bottom:14px;opacity:0;animation:rise .9s ease forwards}
.outcome .narr p:nth-child(2){animation-delay:1.2s}.outcome .narr p:nth-child(3){animation-delay:2.4s}.outcome .narr p:nth-child(4){animation-delay:3.6s}.outcome .narr p:nth-child(5){animation-delay:4.8s}
.outcome .narr p:nth-child(1){animation-delay:.2s}
.noanim .outcome .narr p{opacity:1;animation:none}
.otag{display:inline-block;font-family:var(--cond);letter-spacing:.24em;text-transform:uppercase;font-size:12px;padding:5px 12px;border-radius:99px;border:1px solid}
.o-rendicao .otag{color:var(--green);border-color:var(--green)}.o-intervencao .otag{color:var(--blue);border-color:var(--blue)}.o-fuga .otag{color:var(--orange);border-color:var(--orange)}.o-prazo .otag{color:var(--amber);border-color:var(--amber)}

/* ===== PÓS-JOGO ===== */
.postnav{display:flex;gap:6px;flex-wrap:wrap;padding:14px 0 6px;border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);background:rgba(10,16,26,.94);z-index:30;margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px))}
.pn{padding:8px 14px;border-radius:99px;border:1px solid var(--line2);background:var(--panel);cursor:pointer;font-weight:600;font-size:13px;transition:background .15s,border-color .15s,transform .1s}
.pn:active{transform:scale(.97)}
.pntabs{display:flex;gap:6px;flex-wrap:wrap}
.pn:hover{background:var(--panel2)}
.pn[aria-selected=true]{background:var(--amber);color:#1b1305;border-color:var(--amber)}
.post{padding-top:22px;max-width:1180px;margin:0 auto}
.scorehead{display:grid;grid-template-columns:minmax(260px,420px) 1fr;gap:26px;align-items:center}
.grade{font-family:var(--disp);font-weight:800;font-size:clamp(90px,14vw,170px);line-height:.9}
.grade.S,.grade.A{color:var(--green)}.grade.B{color:var(--blue)}.grade.C{color:var(--amber)}.grade.D{color:var(--orange)}.grade.F{color:var(--red)}
.bigscore{font-family:var(--mono);font-size:24px;color:var(--ink2)}
@media (max-width:820px){.scorehead{grid-template-columns:1fr}}
.dimrow{display:grid;grid-template-columns:150px 1fr 120px;gap:12px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13px}
.dimrow small{color:var(--ink3);display:block;font-size:12px}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.badge{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--panel);display:grid;gap:6px;position:relative}
.badge.on{border-color:var(--amber);background:linear-gradient(180deg,rgba(246,166,35,.13),var(--panel))}
.badge.off{border-style:dashed;background:transparent}.badge.off b{color:var(--ink2)}
.badge .seal{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:#0b1320;border:2px solid var(--line2);color:var(--ink3)}
.badge.on .seal{border-color:var(--amber);color:var(--amber);background:var(--amber-bg)}
.badge b{font-size:14px}.badge p{font-size:12px;color:var(--ink2)}
.timeline{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin-bottom:14px}
.tnode{padding:10px 4px;border-radius:9px;border:1px solid var(--line2);background:var(--panel);text-align:center;cursor:pointer;font-size:12.5px;transition:background .15s,border-color .15s,transform .1s}
.tnode:active{transform:scale(.97)}
.tnode:hover{background:var(--panel2)}
.tnode[aria-selected=true]{border-color:var(--amber);background:var(--amber-bg)}
.tnode b{display:block;font-family:var(--mono);font-size:15px}
.tnode.na{cursor:default;border-style:dashed;background:transparent;color:var(--ink3)}
.concept{display:grid;gap:6px;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.concept h4{font-size:14px}
.concept .ref{font-size:12px;color:var(--ink3);font-family:var(--mono)}
.concept .you{font-size:13px;padding:8px 10px;border-radius:8px;background:var(--bg2);border-left:3px solid var(--amber)}
.concept .les{font-size:13px;color:var(--ink2)}
.kolb{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:820px){.kolb{grid-template-columns:1fr 1fr}}
.table{width:100%;border-collapse:collapse;font-size:13px}
.table td,.table th{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.table th{font-family:var(--cond);text-transform:uppercase;letter-spacing:.1em;font-size:11.5px;color:var(--ink3)}
.scroll-x{overflow-x:auto}

/* ===== JORNAL ===== */
.news{background:var(--paper);color:var(--paperink);padding:clamp(16px,3vw,34px);border-radius:4px;box-shadow:0 20px 60px rgba(0,0,0,.5);background-image:repeating-linear-gradient(0deg,rgba(0,0,0,.015) 0 2px,transparent 2px 4px)}
.news .mast{text-align:center;border-bottom:4px double var(--paperink);padding-bottom:8px}
.news .mast h2{font-family:var(--disp);font-weight:900;font-size:clamp(34px,6.4vw,76px);letter-spacing:.01em;line-height:1}
.news .meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-family:var(--serif);font-size:12.5px;padding:6px 2px;border-bottom:1px solid var(--paperink);text-transform:uppercase;letter-spacing:.08em}
.news .extra{display:inline-block;background:var(--paperink);color:var(--paper);padding:2px 10px;font-family:var(--cond);letter-spacing:.2em;font-size:12px;margin:12px 0 6px}
.news h1.hl{font-family:var(--disp);font-weight:900;font-size:clamp(26px,4.6vw,52px);line-height:1.06;margin:4px 0 8px;text-wrap:balance}
.news .sub{font-family:var(--serif);font-style:italic;font-size:clamp(16px,1.8vw,20px);color:var(--paperink2);border-bottom:1px solid var(--paperink);padding-bottom:10px;margin-bottom:14px}
.news .cols{column-count:3;column-gap:26px;column-rule:1px solid rgba(0,0,0,.35);font-family:var(--serif);font-size:15.5px;line-height:1.55;text-align:justify;hyphens:auto}
.news .cols p{margin:0 0 .85em}
.news .cols p:first-child::first-letter{font-family:var(--disp);font-weight:900;font-size:3.4em;float:left;line-height:.8;padding:6px 6px 0 0}
.news .cols h3{font-family:var(--disp);font-size:17px;margin:.4em 0 .3em;break-after:avoid;text-wrap:balance}
.news .box{break-inside:avoid;border:1.5px solid var(--paperink);padding:10px 12px;margin:0 0 1em;background:var(--paper2);font-size:14px;text-align:left}
.news .box b{font-family:var(--cond);text-transform:uppercase;letter-spacing:.1em;font-size:12px;display:block;margin-bottom:4px}
.news blockquote{margin:0 0 .85em;padding-left:10px;border-left:3px solid var(--paperink);font-style:italic}
.news cite{display:block;font-style:normal;font-size:12px;letter-spacing:.06em;text-transform:uppercase;margin-top:2px}
@media (max-width:980px){.news .cols{column-count:2}}
@media (max-width:620px){.news .cols{column-count:1}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}.brief .narr p,.brief .after,.outcome .narr p{opacity:1}}
.agpulse{animation:agp 1.4s ease-in-out infinite}
@keyframes agp{0%,100%{stroke-opacity:1}50%{stroke-opacity:.25}}

.opt span.d b{display:inline}
#app.still .screen,#app.still .res-line,#app.still .qitem,#app.still .modalback{animation:none}
.siege .colA{align-content:start}

/* ===== L1.2 — imersão, pacing e feedback ===== */
/* ticker de manchetes */
.ticker{display:flex;align-items:stretch;gap:0;margin-top:8px;border:1px solid rgba(255,84,104,.35);border-radius:6px;overflow:hidden;background:#0b111c;font-size:12px;max-width:1560px;margin-inline:auto}
.ticker>b{flex:none;background:#c62a40;color:#fff;font-family:var(--cond);letter-spacing:.14em;font-size:11.5px;padding:4px 10px;display:grid;place-items:center}
.ticker .tk{overflow:hidden;flex:1;position:relative;mask-image:linear-gradient(90deg,transparent,#000 3%,#000 97%,transparent)}
.ticker .tkin{display:inline-flex;gap:18px;white-space:nowrap;padding:4px 0;animation:tick 60s linear infinite;color:#dbe4f1}
.ticker .tkin i{color:var(--red);font-style:normal;font-size:9px;align-self:center}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.brief .ticker{margin:0 0 22px}
@media (prefers-reduced-motion:reduce){.ticker .tkin{animation:none;white-space:normal;flex-wrap:wrap}}
/* reféns no briefing */
.hstrip{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.hstrip .hp{display:grid;justify-items:center;gap:2px;width:52px;opacity:0;animation:rise .5s ease forwards;animation-delay:calc(3.9s + var(--i) * 70ms)}
.hstrip .hp svg{width:20px;height:26px;fill:#5d7aa6}
.hstrip .hp small{font-size:11px;color:var(--ink2);white-space:nowrap}
.noanim .hstrip .hp{opacity:1;animation:none}
.bio{font-family:var(--serif);font-style:italic;font-size:13px;color:var(--ink2);line-height:1.35}
/* reféns no cerco */
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:4px}
.rp{display:grid;padding:3px 7px;border-radius:6px;border:1px solid var(--line);background:var(--bg2);line-height:1.25;min-width:0}
.rp b{font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rp small{font-size:11px;color:var(--ink3)}
.rp.in{border-color:rgba(77,166,255,.35)}
.rp.unk{border-style:dashed}
.rp.out{border-color:rgba(65,208,143,.5);background:var(--green-bg)}.rp.out small{color:var(--green)}
.rp.hurt{border-color:rgba(246,166,35,.6);background:var(--amber-bg)}.rp.hurt small{color:var(--amber)}
.rp.dead{border-color:#5b6475;background:#141922;opacity:.75}.rp.dead b{text-decoration:line-through;text-decoration-color:#8b93a3}
/* linha direta */
.hotline{border:1px solid rgba(246,166,35,.4);background:linear-gradient(180deg,rgba(246,166,35,.08),transparent);border-radius:10px;padding:12px;display:grid;gap:8px}
.hotline .scene{font-family:var(--serif);font-size:15px;line-height:1.5;color:#dfe6f1}
.hotline blockquote{margin:0;padding:8px 12px;border-left:3px solid var(--amber);background:#0d1523;border-radius:0 8px 8px 0;font-family:var(--serif);font-size:16px;font-style:italic}
.hotline blockquote.bad{border-color:var(--red)}.hotline blockquote.good{border-color:var(--green)}
.hotline cite{display:block;font-style:normal;font-family:var(--sans);font-size:12px;color:var(--ink3);margin-top:4px}
.hotline .ask{font-size:12.5px;color:var(--amber);font-weight:600}
.res-line.voice{border-color:rgba(246,166,35,.4);background:#0d1523;font-family:var(--serif);font-style:italic;font-size:15.5px}
/* atualização: céu por hora do dia */
.skyband{position:relative;height:190px;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:linear-gradient(180deg,#36577f,#8aa6c4)}
.skyband svg.skyline{position:absolute;left:0;right:0;bottom:0;width:100%;height:85%}
.skyband .win{animation:flick 6s infinite}
.skyband .siren{bottom:6px;width:110px;height:50px}
.skyband .cap{position:absolute;left:0;right:0;bottom:0;padding:14px 18px;background:linear-gradient(0deg,rgba(5,8,15,.9),rgba(5,8,15,0))}
.skyband h1{font-family:var(--cond);font-size:clamp(26px,4vw,46px);letter-spacing:.03em;margin:4px 0 0;text-shadow:0 2px 12px rgba(0,0,0,.6)}
.skyband.r1 .win,.skyband.r2 .win,.skyband.r3 .win{opacity:.12!important}
.skyband.r1,.skyband.r2{background:linear-gradient(180deg,#3d618d,#9ab5cf)}
.skyband.r3{background:linear-gradient(180deg,#3b5a82,#c3a57d)}
.skyband.r4{background:linear-gradient(180deg,#34466e,#d39361)}
.skyband.r5{background:linear-gradient(180deg,#2a3158,#e07b4a)}
.skyband.r6{background:linear-gradient(180deg,#1d2346,#a8505a)}
.skyband.r7{background:linear-gradient(180deg,#0b1122,#2b3058)}
.skyband.r8{background:linear-gradient(180deg,#04070d,#121a33)}
.skyband.r1 .siren,.skyband.r2 .siren{display:none}
.track{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
.track .tk{position:relative;display:grid;gap:3px;justify-items:center;font-family:var(--mono);color:var(--ink3)}
.track .tk i{display:block;width:100%;height:6px;border-radius:99px;background:#0b1320;border:1px solid var(--line2)}
.track .tk.past i{background:var(--line2)}
.track .tk.now i{background:var(--amber);border-color:var(--amber);box-shadow:0 0 0 3px rgba(246,166,35,.18)}
.track .tk.now small{color:var(--amber)}
.track small{font-size:11px}
.track em{position:absolute;top:-16px;color:var(--amber)}
.intro{font-size:clamp(17px,1.9vw,21px);line-height:1.6;color:#dfe6f1}
.call{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;padding:12px 14px;border-radius:10px;border:1px solid rgba(255,84,104,.45);background:var(--red-bg)}
.call .ico{color:#ff9aa7;width:28px;height:28px}
.call small{font-family:var(--cond);text-transform:uppercase;letter-spacing:.12em;font-size:11.5px;color:#ff9aa7}
.call p{font-family:var(--serif);font-size:16.5px;line-height:1.45;margin-top:2px}
.council{display:grid;gap:10px}
.adv{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:start}
.adv .sil{width:44px;height:50px}
.adv b{font-size:13.5px}
.adv p{font-family:var(--serif);font-size:15px;line-height:1.45;color:#dfe6f1;margin-top:3px}
.pill.violet{color:var(--violet);border-color:rgba(167,139,250,.5);background:rgba(167,139,250,.12)}
/* dossiê de inteligência */
.dossiers{display:grid;gap:10px}
.dossier{position:relative;padding:12px 14px;border-radius:10px;border:1px solid var(--line2);background:#0d1523;display:grid;gap:6px;font-size:13px;animation:fadein .5s both}
.dossier.ok{border-color:rgba(65,208,143,.55)}
.dossier.no{border-color:rgba(246,166,35,.5)}
.dossier .stamp{position:absolute;top:10px;right:12px;font-family:var(--cond);text-transform:uppercase;letter-spacing:.18em;font-size:11px;font-weight:700;padding:2px 8px;border:2px solid;border-radius:4px;transform:rotate(-4deg)}
.dossier.ok .stamp{color:var(--green)}.dossier.no .stamp{color:var(--amber)}
.dossier b{font-size:13.5px;padding-right:110px}
.dossier .impact{padding:7px 10px;border-radius:7px;background:var(--blue-bg);border:1px solid rgba(77,166,255,.35)}
.dossier .impact small{display:block;font-family:var(--cond);text-transform:uppercase;letter-spacing:.12em;font-size:11px;color:var(--blue)}
/* guia da primeira rodada */
.guide{border-color:rgba(77,166,255,.5);background:linear-gradient(180deg,var(--blue-bg),var(--panel))}
.guide ol{margin:0 0 6px;padding-left:18px;display:grid;gap:5px;font-size:13px}
/* resolução: seções, causa e efeito */
.sec{display:grid;gap:8px}
.wf{display:grid;gap:6px}
.wfr{display:grid;grid-template-columns:minmax(120px,1.2fr) 1fr 92px;gap:8px;align-items:center;font-size:12.5px}
.wfr>span{color:var(--ink2)}
.wfr b{text-align:right;font-size:12px}
.wfb{position:relative;height:10px;background:#0b1320;border-radius:99px;border:1px solid var(--line)}
.wfb::after{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--ink3)}
.wfb i{position:absolute;top:0;bottom:0;border-radius:99px}
.wfb i.bad{background:var(--red)}.wfb i.good{background:var(--green)}
.wfr.tot{border-top:1px dashed var(--line);padding-top:6px}
.sw{font-size:12.5px;padding:6px 0;border-bottom:1px dashed var(--line)}
.sw small{display:block;color:var(--ink3);margin-top:2px;font-size:12px}
.sw .pos{color:var(--green)}.sw .neg{color:#ff9aa7}
.hc{display:grid;grid-template-columns:22px 1fr;gap:8px;font-size:13px;padding:8px 10px;border-radius:8px;border:1px solid var(--line)}
.hc .ico{width:18px;height:18px}
.hc.out{border-color:rgba(65,208,143,.45);background:var(--green-bg)}.hc.out .ico{color:var(--green)}
.hc.hurt{border-color:rgba(246,166,35,.5);background:var(--amber-bg)}.hc.hurt .ico{color:var(--amber)}
.hc.dead{border-color:#5b6475;background:#141922}.hc.dead .ico{color:var(--ink3)}
/* revelação final */
.truth .trows{display:grid;gap:6px}
.truth .tr{display:grid;grid-template-columns:150px 1fr;gap:4px 12px;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg2);font-size:13px}
.truth .tr small{grid-column:1/-1;color:var(--ink3);font-size:12px}
.truth .tr.k small{color:var(--green)}.truth .tr.u small{color:#ff9aa7}
.truth .tr b{font-family:var(--mono)}
.truth p{font-family:var(--serif);font-size:16px;line-height:1.5}
/* corte de cena entre fases */
.cut{position:fixed;inset:0;z-index:120;display:grid;place-items:center;padding:24px;background:radial-gradient(800px 400px at 50% 40%,rgba(22,35,59,.97),rgba(3,6,12,.98));animation:fadein .4s}
.cutin{max-width:680px;text-align:center;display:grid;gap:14px}
.cutin .time{font-family:var(--mono);color:var(--amber);font-size:clamp(40px,7vw,72px);line-height:1}
.cutin h2{font-family:var(--cond);text-transform:uppercase;letter-spacing:.22em;font-size:clamp(18px,2.4vw,26px)}
.cutin p{font-family:var(--serif);font-size:clamp(16px,1.9vw,20px);line-height:1.55;color:#dfe6f1;opacity:0;animation:rise .8s ease forwards}
.cutin p.radio-q{font-family:var(--mono);font-size:13.5px;color:#cdd8e8;border-left:3px solid var(--red);padding-left:12px;text-align:left}
.cutin .btn{opacity:0;animation:rise .6s ease forwards}
@media (prefers-reduced-motion:reduce){.cutin p,.cutin .btn,.hstrip .hp{opacity:1}}
.icard .dossier>b{display:none}
.icard .dossier .stamp{position:static;justify-self:start;transform:none;margin-bottom:2px}

/* =====================================================================
   L1.3 — operações: caixa, gargalo, alertas, prévias
   ===================================================================== */
.stat .burn{font-style:normal;font-family:var(--mono);font-size:11px;color:var(--ink3);margin-top:1px}
.stat .burn.bad{color:#ff9aa7;font-weight:600}
.stat.tocchip b{font-family:var(--cond);font-size:14px;letter-spacing:.04em}
.stat.tocchip.violet b{color:var(--violet)}.stat.tocchip.blue b{color:var(--blue)}.stat.tocchip.amber b{color:var(--amber)}
/* caixa */
.cashtop{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.cashtop div{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:7px 9px}
.cashtop small{display:block;font-family:var(--cond);text-transform:uppercase;letter-spacing:.1em;font-size:11px;color:var(--ink3)}
.cashtop b{font-size:18px;color:var(--ink);border-radius:3px}.cashtop b i{font-style:normal;font-size:11px;color:var(--ink3);font-weight:400}
.cash .cashtop div:first-child b{color:var(--amber)}
.stack{display:flex;height:12px;border-radius:99px;overflow:hidden;border:1px solid var(--line);background:#0b1320}
.stack i{display:block;height:100%;min-width:2px}
.stack i+i{border-left:1px solid var(--bg)}
.stackleg{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:8px;font-size:12px;color:var(--ink2)}
.stackleg i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px}
.stackleg b{color:var(--ink);font-weight:600}
/* utilização da equipe */
.util{display:flex;gap:6px;margin-bottom:8px}
.util span{flex:1;text-align:center;background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:5px 4px;font-size:11.5px;color:var(--ink3);line-height:1.2}
.util b{display:block;font-family:var(--mono);font-size:17px;color:var(--ink)}
.trow small .tr1,.trow small .tr2{color:var(--amber);font-weight:600}
/* equipamentos */
.gearlist{display:grid;gap:6px}
.gl{display:grid;grid-template-columns:24px 1fr;gap:8px;align-items:center;font-size:12.5px;padding:6px 8px;background:var(--bg2);border:1px solid var(--line);border-radius:8px}
.gl .ico{width:20px;height:20px}
.gl small{display:block;color:var(--ink3);font-size:11.5px}
.gl.idle{border-style:dashed;opacity:.8}.gl.idle small{color:var(--amber)}
/* alertas */
.alerts .alert{display:grid;grid-template-columns:24px 1fr auto;gap:10px;align-items:center;padding:9px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg2);margin-bottom:8px}
.alerts .alert .ico{width:22px;height:22px}
.alerts .alert b{font-size:13.5px}
.alerts .alert em{font-style:normal;font-family:var(--cond);text-transform:uppercase;letter-spacing:.1em;font-size:11px;margin-left:6px;padding:1px 6px;border-radius:99px;border:1px solid currentColor}
.alerts .alert span{display:block;font-size:12.5px;color:var(--ink2);line-height:1.4;margin-top:2px}
.alerts .alert.s3{border-color:rgba(255,84,104,.6);background:var(--red-bg)}.alerts .alert.s3 .ico,.alerts .alert.s3 em{color:#ff9aa7}
.alerts .alert.s2{border-color:rgba(246,166,35,.55);background:var(--amber-bg)}.alerts .alert.s2 .ico,.alerts .alert.s2 em{color:var(--amber)}
.alerts .alert.s1{border-color:rgba(77,166,255,.4);background:var(--blue-bg)}.alerts .alert.s1 .ico,.alerts .alert.s1 em{color:var(--blue)}
.alerts.calm{border-color:rgba(65,208,143,.35)}
/* gargalo */
.tocbars{display:grid;gap:8px}
.tocb{display:grid;grid-template-columns:150px 1fr 34px auto;gap:10px;align-items:center;font-size:12.5px;color:var(--ink2)}
.tocb span{display:flex;align-items:center;gap:6px}
.tocb .ico{width:16px;height:16px}
.tocb b{text-align:right;color:var(--ink)}
.tocb em{font-style:normal;font-family:var(--cond);text-transform:uppercase;letter-spacing:.12em;font-size:11px;padding:1px 7px;border-radius:99px;background:var(--amber);color:#1b1305;font-weight:700}
.tocb:not(.lead) em{display:none}.tocb:not(.lead){opacity:.78}
.tocb.lead .meter{height:11px}
.toctl{display:flex;align-items:center;gap:10px;margin:10px 0 6px;font-size:11.5px;color:var(--ink3)}
.toctl small{font-family:var(--cond);text-transform:uppercase;letter-spacing:.1em;font-size:11px}
.toctl span{display:flex;gap:5px}
.td{display:inline-block;width:20px;height:9px;border-radius:3px;background:var(--panel2);border:1px solid var(--line)}
.td.violet{background:var(--violet);border-color:var(--violet)}.td.blue{background:var(--blue);border-color:var(--blue)}.td.amber{background:var(--amber);border-color:var(--amber)}
.td.now{outline:2px solid var(--ink);outline-offset:1px}
.toc .why{font-size:13px;line-height:1.45}
.toc .elev{font-size:12.5px;color:var(--ink2);margin-top:6px;padding:7px 10px;border-radius:8px;background:var(--green-bg);border:1px solid rgba(65,208,143,.35);line-height:1.4}
.toc .elev small{font-family:var(--cond);text-transform:uppercase;letter-spacing:.12em;font-size:11px;color:var(--green);font-weight:700;margin-right:8px}
.toc .elev.stop{background:var(--red-bg);border-color:rgba(255,84,104,.35)}.toc .elev.stop small{color:#ff9aa7}
.tocshift .tsrow{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start}
.tocshift .tsrow .ico{width:28px;height:28px;color:var(--amber)}
.tocshift p{font-size:13.5px;color:var(--ink2);margin-top:4px;line-height:1.5}
.tocshift.calm{padding:10px 14px}.tocshift.calm .tsrow .ico{width:22px;height:22px}.tocshift.calm .tsrow{font-size:13px;color:var(--ink2)}
/* prévias */
.rprev{border:1px dashed var(--line2);border-radius:8px;padding:8px 10px;background:var(--bg)}
.rprev .rp{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;padding:2px 0}
.rprev .rp span{color:var(--ink2);text-align:right}
.rprev em,.pprev .pos,.pprev .neg{font-style:normal}
.rprev em.pos,.pprev .pos{color:var(--green)}.rprev em.neg,.pprev .neg{color:#ff9aa7}
.pprev .pr{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:13px}
.pprev .pr:last-child{border-bottom:0}
.pprev .pr small{grid-column:1/-1;color:var(--ink3);font-size:12px}
.pprev .pr b.red{color:#ff9aa7}.pprev .pr b.amber{color:var(--amber)}.pprev .pr b.blue{color:var(--blue)}.pprev .pr b.green{color:var(--green)}
/* marcos */
.miles{margin-top:6px}
.mlist{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.mile{display:inline-flex;gap:6px;align-items:center;padding:3px 9px;border-radius:99px;font-size:12px;border:1px solid var(--line2);background:var(--bg2);color:var(--ink2)}
.mile b{font-family:var(--mono);color:var(--ink)}
.mile.red{border-color:rgba(255,84,104,.5);background:var(--red-bg)}.mile.amber{border-color:rgba(246,166,35,.5);background:var(--amber-bg)}.mile.blue{border-color:rgba(77,166,255,.45);background:var(--blue-bg)}
/* previsão no recrutamento */
.fc{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13px}
.fc:last-child{border-bottom:0}
.fc small{grid-column:1/-1;color:var(--ink3);font-size:12px}
.fc.ok b{color:var(--green)}.fc.warn b{color:var(--amber)}.fc.bad b{color:#ff9aa7}
/* debrief econômico */
.econ .kv b{font-size:15px}
.econ .runs{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.econ .run{padding:4px 10px;border-radius:8px;font-size:12.5px;border:1px solid var(--line2)}
.econ .run.violet{border-color:var(--violet);background:rgba(167,139,250,.12)}.econ .run.blue{border-color:var(--blue);background:var(--blue-bg)}.econ .run.amber{border-color:var(--amber);background:var(--amber-bg)}
@media (max-width:1180px){.tocb{grid-template-columns:120px 1fr 30px auto}.alerts .alert{grid-template-columns:24px 1fr}.alerts .alert .btn{grid-column:2;justify-self:start}}

/* =====================================================================
   L1.4 — revisão de UX/UI: hierarquia, affordances, foco, microinterações
   ===================================================================== */
[tabindex="-1"]:focus{outline:none}
kbd{font-family:var(--mono);font-size:11.5px;padding:1px 6px;border-radius:4px;border:1px solid var(--line2);border-bottom-width:2px;background:var(--bg2);color:var(--ink)}
.tutor .h3{font-size:18px;text-transform:none;letter-spacing:0;color:var(--ink);font-family:var(--sans);font-weight:600;justify-content:flex-start}
/* títulos de página: um h1 por tela */
.ptitle{font-size:24px;font-weight:600;margin:4px 0 8px;letter-spacing:-.005em}
.rtitle{font-family:var(--cond);font-size:clamp(28px,4vw,44px);letter-spacing:.02em;margin:6px 0 0}
/* barra de ação fixa: o próximo passo sempre à vista */
.actbar{position:fixed;left:0;right:0;bottom:0;z-index:45;background:rgba(10,16,26,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line2);box-shadow:0 -12px 30px rgba(0,0,0,.35);padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.actin{max-width:1560px;margin:0 auto;display:flex;align-items:center;gap:14px;min-height:50px}
.actin .btn.lg{flex:none}
.absum{display:grid;gap:1px;font-size:13px;color:var(--ink2);min-width:0}
.abk{font-family:var(--cond);text-transform:uppercase;letter-spacing:.14em;font-size:11.5px;color:var(--ink3);font-weight:600;white-space:nowrap}
.abmsg{flex:1;display:flex;align-items:center;gap:8px;font-size:13px;color:#ffc2ca;min-width:0}
.abmsg .ico{width:20px;height:20px;color:#ff9aa7;flex:none}
body.withbar{padding-bottom:104px}
.slotc{display:inline-flex;align-items:center;gap:5px}
.slotc b{font-size:13px;color:var(--ink);margin-left:3px;letter-spacing:0}
.qchips{flex:1;display:flex;gap:6px;align-items:center;min-width:0;overflow:hidden;font-size:13px}
.qchip{display:inline-flex;align-items:center;gap:6px;min-width:0;max-width:300px;flex:0 1 auto;padding:4px 4px 4px 10px;border-radius:99px;border:1px solid rgba(246,166,35,.5);background:var(--amber-bg);font-size:12.5px;animation:pop .28s ease both}
.qchip .ico{width:15px;height:15px;color:var(--amber);flex:none}
.qchip .ql{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.qchip .qc{color:var(--amber);font-size:12px;flex:none}
.qx{flex:none;width:24px;height:24px;border-radius:50%;border:1px solid transparent;background:transparent;color:var(--ink2);cursor:pointer;font-size:11px;line-height:1;transition:background .15s,color .15s}
.qx:hover{background:var(--red-bg);border-color:rgba(255,84,104,.5);color:#ffb3bc}
@keyframes pop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
#app.still .qchip{animation:none}
@media (max-width:1180px){.qchip{max-width:220px}.actin{gap:10px}}
/* indisponível: motivo visível, sem apagar o texto */
.unav{display:block;margin-top:4px;font-size:12px;color:#ffc2ca;font-weight:500}
small.unav{margin:0}
.inplan{font-size:11px;padding:1px 7px;margin-left:4px;vertical-align:1px}
.planfull{display:grid;grid-template-columns:22px 1fr;gap:8px;align-items:start;padding:8px 10px;border-radius:8px;border:1px solid rgba(246,166,35,.5);background:var(--amber-bg);font-size:13px}
.planfull .ico{width:18px;height:18px;color:var(--amber)}
.planfull.bad{border-color:rgba(255,84,104,.5);background:var(--red-bg)}.planfull.bad .ico{color:#ff9aa7}
/* cartões do recrutamento: estado e efeito do clique por escrito */
.cfoot{display:block;font-size:12px;color:var(--ink3);border-top:1px dashed var(--line);padding-top:7px;margin-top:1px}
.cfoot.on{color:var(--green)}.cfoot.no{color:#ffc2ca}
.gcard .cfoot{border:0;padding:3px 0 0}
.acard:active{transform:scale(.99)}.gcard:active{transform:scale(.99)}
.jump{font-size:12.5px;color:var(--blue);text-decoration:none;border-bottom:1px dashed rgba(77,166,255,.5)}
.jump:hover{color:#8cc6ff;border-bottom-style:solid}
.anchor{scroll-margin-top:90px}
/* caixa de seleção maior */
.check{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--ink2);cursor:pointer;line-height:1.4}
.check input{width:18px;height:18px;margin:1px 0 0;accent-color:var(--amber);flex:none;cursor:pointer}
.check:hover{color:var(--ink)}
@media (max-height:820px){.sky{height:min(36vh,400px)}}
/* briefing */
.skipb{animation:skipaway .3s ease 4.4s forwards}
.noanim .skipb{display:none}
@keyframes skipaway{to{opacity:0;visibility:hidden}}
/* letreiro: pausa ao passar o mouse, ao focar e pelo botão */
.ticker:hover .tkin,.ticker:focus-within .tkin,.ticker.paused .tkin{animation-play-state:paused}
.tkp{flex:none;width:30px;border:0;border-left:1px solid rgba(255,84,104,.35);background:#0e1522;color:var(--ink2);cursor:pointer;font-size:10px;letter-spacing:-.1em;transition:background .15s,color .15s}
.tkp:hover{background:var(--panel2);color:var(--ink)}
.tkp[aria-pressed=true]{color:var(--amber)}
/* mapa: modo de posicionamento */
.target{display:grid;grid-template-columns:22px 1fr;gap:8px;align-items:center;margin-bottom:8px;padding:8px 12px;border-radius:8px;border:1px solid rgba(77,166,255,.5);background:var(--blue-bg);font-size:13px;animation:fadein .2s both}
.target .ico{width:18px;height:18px}
.map.targeting .zone{cursor:copy}
.map.targeting .zone rect.z{stroke-dasharray:6 4;animation:march 1.2s linear infinite}
.map.targeting .zone:hover rect.z,.map.targeting .zone:focus-visible rect.z{stroke:var(--blue);stroke-width:3.5;stroke-dasharray:none;animation:none}
@keyframes march{to{stroke-dashoffset:-20}}

.tdot{position:absolute;top:5px;right:7px;width:7px;height:7px;border-radius:50%;background:var(--amber);box-shadow:0 0 0 2px var(--bg2)}
.tab[aria-selected=true] .tdot{box-shadow:0 0 0 2px var(--blue)}
.lvtabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:4px;margin-bottom:12px}
.lvtab{position:relative;display:grid;grid-template-columns:22px 1fr;gap:8px;align-items:center;text-align:left;padding:7px 8px;border-radius:7px;border:1px solid transparent;background:transparent;color:var(--ink2);cursor:pointer;font-size:13px;font-weight:600;transition:background .15s,color .15s,border-color .15s,transform .1s}
.lvtab small{display:block;font-weight:400;font-size:11.5px;color:var(--ink3)}
.lvtab>b{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--blue);color:#06162a;font-size:11.5px}
.lvtab.l2>b{background:var(--amber);color:#1b1305}.lvtab.l3>b{background:var(--violet);color:#150f2b}
.lvtab:hover{background:var(--panel2);color:var(--ink)}
.lvtab:active{transform:scale(.98)}
.lvtab[aria-selected=true]{background:var(--panel2);border-color:var(--line2);color:var(--ink)}
.lvtab[aria-selected=true] small{color:var(--ink2)}
.lvtab em{position:absolute;top:6px;right:8px;font-style:normal;font-family:var(--mono);font-size:11px;min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--amber);color:#1b1305;display:grid;place-items:center;font-weight:600}

.swap{animation:fadein .22s ease both}

.fields2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}

<script>
/* =====================================================================
   PERÍMETRO — simulação educacional de gestão de crise (single-player)
   ---------------------------------------------------------------------
   ARQUITETURA (resumo)
   1) ESTADOS (máquina): menu → briefing → recruit(F0) → perimeter(F1) → siege(F2, 8 rodadas)
      → outcome(F3) → post[score → news → badges → replay → debrief]
      Dentro de siege, G.stage: 'update' → 'panel' → 'event' → 'result' → (próxima rodada | outcome)
   2) MODELO DE DADOS: G (estado único serializável em JSON → localStorage). Dados estáticos
      (AGENTS, EQUIP, PROFILES, EVENTS, DIFF, ZONES, INTEL, POSTURES) ficam fora de G.
   3) MOTOR: funções puras sobre G (coverage, agentEff, negotiation, agitation, media, vault,
      stakeholders, intervention, escape, score). Interface só chama o motor e renderiza.
   4) FLUXO DE RODADA: startRound() [atualização: resultados de inteligência + relatórios
      distribuídos] → painel (Endsley N1/N2/N3) → decisões (fila, limite de "slots")
      → resolveDecisions() → sorteio de evento → applyEvent() → finishRound() [fadiga, desfecho]
      → feedback com deltas animados.
   5) DECISÕES: 4 frentes — Tática, Negociação, Inteligência, Comunicação; cada uma ocupa 1 slot
      (Intervenção ocupa todos). Créditos são debitados na hora; sem crédito a ação fica bloqueada.
   6) PONTUAÇÃO: (vidas×.40 + captura×.20 + valores×.15 + eficiência×.10 + confiança×.15)×100,
      com tetos de nota quando há reféns mortos (princípio: perspectiva de quem protege).
   ===================================================================== */

const MAX_ROUNDS = 8;
const HOSTAGES = 17;
const START_TIME = 14 * 60 + 7;   // 14h07
const ROUND_MIN = 45;             // minutos simulados por rodada

   Custo de plantão: cada rodada o posto de comando paga a operação (base + agentes em campo), escalado pela dificuldade.
   Quem descansa na reserva ou foi reconvocado não custa plantão: rodízio economiza verba, mas abre zonas.
   Apoio externo encarece a cada uso (urgência tem preço crescente); horas extras custam proporcional ao efetivo em campo. */

  if (rnd() < p) {
    const H = G.hostages; H.freed += H.inside - H.dead; H.inside = H.dead;
    const h = rnd() < .3 ? addHurtFree(1) : 0;

/* ---------------- Pontuação ---------------- */
function stakeWeights() {
  const H = G.hostages, harm = H.hurt + H.dead > 0;
  const w = Object.fromEntries(STK_KEYS.map(k => [k, STK[k].w]));
  if (harm) { w.familias += .10; w.banco -= .08; }       // famílias ganham legitimidade; banco a perde
  if (G.round >= 6) w.prefeito += .08;                    // prefeito ganha urgência
  const t = Object.values(w).reduce((a, b) => a + b, 0);
  STK_KEYS.forEach(k => w[k] /= t);

function eficienciaCusto() { return clamp(.6 * Math.min(1, Math.max(0, G.credits) / CREDITOS_INICIAIS) + .4 * (1 - (G.round - 1) / MAX_ROUNDS * .8), 0, 1); }

  const vidas = vidasScore(H);
  const captura = clamp(E.captured, 0, 1);
  const valores = clamp(1 - E.lootF * (G.vault / 100), 0, 1);
  const eficiencia = eficienciaCusto();
  const confianca = confidence();
  const raw = Math.min(100, (vidas * .40 + captura * .20 + valores * .15 + eficiencia * .10 + confianca * .15) * 100);
  const penal = PENAL_AGENTE * (E.agentsHurt ? E.agentsHurt.length : 0);
  // Tetos (perspectiva de quem protege): vidas perdidas e intervenção fracassada nunca contam como boa condução,
  // e acertar uma aposta (entrada voluntária com menos de 50% de chance) é sorte, não método: no máximo nota A.
  const failed = (E.type === 'intervencao' && E.variant === 'fracasso') || (E.type === 'prazo' && E.sub === 'fracasso');
  const aposta = E.type === 'intervencao' && !E.forced && E.P < APOSTA_P;

  if (H.dead >= 1) tetos.push({ v: H.dead >= 4 ? 49 : H.dead >= 2 ? 64 : 79, why: 'mortes' });
  if (failed) tetos.push({ v: 49, why: 'fracasso' });
  if (aposta) tetos.push({ v: 89, why: 'aposta' });
  const teto = tetos.sort((a, b) => a.v - b.v)[0] || { v: 100, why: null };
  const cap = teto.v;
  const total = Math.round(Math.max(0, Math.min(raw, cap) - penal) * 10) / 10;   // uma casa decimal, a mesma que a tela mostra: a nota e a faixa nunca discordam
  G.score = { vidas, captura, valores, eficiencia, confianca, raw, total, cap, capWhy: teto.why, capped: raw > cap, penal, grade: gradeOf(total) };
  return G.score;
}

/* ---------------- Inteligência ---------------- */

}

const slotsLeft = () => D_().slots - G.queue.reduce((s, d) => s + d.slots, 0);

  if (G.queue.some(q => q.kind === 'interv')) return { ok: false, msg: 'A intervenção ocupa a rodada inteira. Remova-a para tomar outras decisões.' };
  if (d.kind === 'nego') { const old = G.queue.find(q => q.kind === 'nego'); if (old) removeDecision(old.id); }
  if (d.kind === 'pausa' && G.queue.some(q => q.kind === 'pausa')) return { ok: false, msg: 'A Pausa de Comando já está no plano.' };

  if (slotsLeft() < d.slots) return { ok: false, msg: 'Sem decisões disponíveis nesta rodada. Remova uma ação do plano.' };
  if (G.credits < queueCost(d)) return { ok: false, msg: 'Créditos insuficientes para essa ação.' };

}

  G.queue.filter(q => q.kind === 'apoio').forEach(q => { const c = APOIO_PRECOS[Math.min(k++, APOIO_PRECOS.length - 1)]; G.credits += q.cost - c; q.cost = c; });
}

function resolveNego(dec, R) {

function resolveDecisions() {
  const R = { lines: [], s0: snap(), decs: [], eventId: null, ev: null, skipEvent: false, sec: 'dec', stkWhy: {}, hchg: [] };

  stake('banco', -(G.lastVaultDelta * .4)); why(R, 'banco', -(G.lastVaultDelta * .4), 'avanço do cofre');

const HEAVY = ['tiroteio', 'segundo', 'cumplice', 'live', 'infiltrado', 'passamal', 'proposta'];
function drawEvent() {
  const D = D_(); if (G.round < 2 || G.quietRound === G.round || rnd() > D.evChance) return null;
  const avgFat = deployed().length ? deployed().reduce((s, id) => s + (G.fat[id] || 0), 0) / deployed().length : 0;
  const pool = EVENT_DEFS.filter(e => !G.usedEvents.includes(e.id) && EVENT_FX[e.id].elig(G));
  if (!pool.length) return null;
  const e = wpick(pool, x => {
    let w = 1;
    if ((x.id === 'heli' || x.id === 'live') && G.media > 60) w *= 2;
    if (x.id === 'fadiga') w *= (avgFat >= 2 ? 3 : .5);
    if (x.id === 'deadline') w *= 4;
    if (x.id === 'prefeito' && G.round >= 4) w *= 2;
    return w;
  });
  G.usedEvents.push(e.id);
  if (HEAVY.includes(e.id)) G.quietRound = G.round + 1;   // respiro: a rodada seguinte não tem carta de evento
  return e.id;
}
function chooseEvent(idx) {
  const R = G.R, fx = EVENT_FX[G.pendingEvent], ch = fx.choices[idx];
  if (ch.cost && G.credits < ch.cost) return false;
  R.ev = { id: G.pendingEvent, choice: ch.label }; R.sec = 'ev';
  ch.run(R); G.pendingEvent = null; G.pressure = calcPressure(); G.stage = 'resolving';
  finishRound(); return true;
}

/* ---------------- Fim de rodada / desfecho ---------------- */
function finishRound() {
  const R = G.R, D = D_();
  R.sec = 'fim';
  let out = null;
  if (R.interv) { out = doIntervention(false); }
  // ação desesperada
  if (!out && G.agit > 80 && rnd() < (G.agit - 80) * .02 * D.desp) {
    if (rnd() < (D.violent || .55)) {
      const h = addHurt(1), dead = h && rnd() < .25 * D.lethal ? addDead(1) : 0; addAgit(-10);
      L(R, 'bad', 'shot', `AÇÃO DESESPERADA: o líder dispara contra a parede e agride um refém${dead ? ', que não sobrevive' : h ? ', que fica ferido' : ''}. A tensão se esvazia por um instante (agitação −10).`);
    } else {
      L(R, 'bad', 'road', 'AÇÃO DESESPERADA: o líder tenta romper o perímetro em direção à rota de fuga!');
      out = doEscape('desespero');
    }
  }
  if (!out && G.nego.step === 5 && G.agit <= D.ret) out = doSurrender();
  if (!out && G.vault >= 100) { L(R, 'bad', 'bank', 'O cofre foi aberto. Com o butim, o grupo parte para a fuga!'); out = doEscape('cofre'); }
  if (!out && G.round >= 6 && G.stk.prefeito.lost && G.stk.prefeito.sat <= 15) { L(R, 'bad', 'mayor', 'ORDEM POLÍTICA: o prefeito determina a intervenção imediata, contra a sua recomendação técnica.'); out = doIntervention(true); }
  if (!out && G.round >= MAX_ROUNDS) out = doUltimatum();
  // manutenção de fim de rodada
  syncHL(R);
  R.s1 = snap();
  const rec = { r: G.round, time: fmtTime(G.round), decs: R.decs, lines: R.lines.slice(), ev: R.ev, s0: R.s0, s1: R.s1, interv: !!R.interv };
  G.log.push(rec);
  G.hist.push({ r: G.round, agit: Math.round(G.agit), media: Math.round(G.media), vault: Math.round(G.vault), credits: G.credits, cov: R.s1.cov, p: G.pressure });
  if (out) {
    G.end = out; G.stage = 'result'; G.phase = 'siege'; R.out = out;
    computeScore(); saveGame(); return { outcome: out };
  }
  // upkeep
  G.team.forEach(id => {
    if (isAway(id)) { G.away[id]--; return; }
    const z = G.az[id];
    if (z === 'reserva') { if (getNegotiator() === id && R.decs.some(d => d.kind === 'nego')) G.fat[id] = (G.fat[id] || 0) + .5; else G.fat[id] = 0; }
    else G.fat[id] = (G.fat[id] || 0) + 1;
    G.transit[id] = Math.max(0, (+G.transit[id] || 0) - 1);
    G.stats.minFF = Math.min(G.stats.minFF, ff(id));
  });
  Object.keys(G.support).forEach(z => { if (G.support[z].left > 0) G.support[z].left--; });
  if (G.exposed > 0) G.exposed--;
  if (G.powerCut > 0) G.powerCut--;
  if (G.calm > 0) G.calm = Math.max(0, G.calm - 10);
  if (G.fatCrit && !deployed().some(id => (G.fat[id] || 0) >= 2)) G.fatCrit = false;
  if (G.deadlineLeft > 0) {
    G.deadlineLeft--;
    if (G.deadlineLeft === 0) { stake('prefeito', -15); addMedia(10); L(R, 'bad', 'clock', 'O prazo do noticiário venceu sem desfecho: o prefeito perde 15 pontos e a mídia sobe +10.'); }
  }
  G.pressure = calcPressure();
  G.stage = 'result'; saveGame();
  return { next: true };
}

/* ---------------- Visão da sacada (Pausa de Comando) ---------------- */
function sacadaView() {
  const out = [], toc = tocConstraint();
  out.push(`Restrição atual do sistema: ${toc.label}. ${toc.why}`);
  const w = STK_KEYS.slice().sort((a, b) => G.stk[b].sem - G.stk[a].sem)[0];
  if (G.stk[w].sem >= 1) out.push(`${STK[w].nome} está há ${G.stk[w].sem} rodada${G.stk[w].sem > 1 ? 's' : ''} sem atenção do comando e sua satisfação é ${Math.round(G.stk[w].sat)}. O barulhento nem sempre é o mais saliente: revise quem pode virar problema.`);
  const topEv = Object.entries(G.ev).sort((a, b) => b[1] - a[1])[0];
  if (topEv && topEv[1] >= 1.5) out.push(`Os relatos de campo convergem para ${ZONE[topEv[0]].nome} (${topEv[1].toFixed(1)} indícios ponderados). Cuidado: relatos de baixa confiança também contam e podem ser ruído.`);
  else out.push('Os relatos de campo ainda não convergem para uma rota. Cada agente só vê o que está na sua zona: informação distribuída precisa ser integrada por você.');
  const hot = G.agit > 70 ? 'A agitação do líder está em zona de risco: a negociação é a única alavanca que reduz o risco aos reféns sem custo tático.' : G.pressure > 70 ? 'A pressão sobre a equipe passou da zona ótima: a eficiência cai com pressão alta demais. Um respiro ajuda.' : G.pressure < 30 ? 'A pressão está baixa demais: a equipe pode estar em modo complacente.' : 'A pressão da equipe está na zona produtiva.';
  out.push(hot);
  return out.slice(0, 4);
}
/* =====================================================================
   ANÁLISE PARA OS PAINÉIS (L1.3) — funções que só leem o estado.
   Previsões e prévias usam apenas o que o comandante pode saber: nada aqui vaza variável oculta.
   Quando uma prévia precisa simular uma ordem, ela altera o estado e o restaura na mesma chamada.
