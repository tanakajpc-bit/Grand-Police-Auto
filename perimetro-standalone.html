/* Rótulos usados tanto pelos painéis quanto pelas prévias e alertas (por isso moram aqui, e não na interface) */
const shortName = n => n.split(' ').slice(0, 2).join(' ');
const pLabel = p => p < .2 ? 'Baixa' : p < .45 ? 'Média' : p < .7 ? 'Boa' : 'Alta';
const pCls = p => p < .2 ? 'red' : p < .45 ? 'amber' : p < .7 ? 'blue' : 'green';

/* ---------- Percepção com névoa ----------
   O que o comandante enxerga da agitação e do cofre antes de medir. Vive aqui, e não na interface, para os painéis e alertas
   poderem ser testados sem navegador. */
function perceivedAgit(a = G.agit) {
  const off = ((G.round * 13) % 11) - 5;
  const band = a < 30 ? 'Baixa' : a < 55 ? 'Média' : a < 75 ? 'Alta' : 'Crítica';
  if (G.nego.contact && G.K.profile) return { v: Math.round(a), txt: String(Math.round(a)), band, exact: true };
  if (G.nego.contact) { const v = clamp(Math.round((a + off) / 5) * 5, 0, 100); return { v, txt: '≈' + v, band, exact: false }; }
  return { v: a + off, txt: band, band, exact: false };
}
function perceivedVault(vv = G.vault) {
  if (G.K.vault) return { txt: Math.round(vv) + '%', v: vv, exact: true };
  const off = ((G.round * 37) % 21) - 10, lo = clamp(Math.round((vv + off - 12) / 5) * 5, 0, 100), hi = clamp(lo + 25, 0, 100);
  return { txt: `≈ ${lo}–${hi}%`, v: (lo + hi) / 2, exact: false };
}
const hostagesFramed = () => {
  const H = G.hostages, safe = H.inside - H.hurt - H.dead;
  if (G.K.hostages) return G.frame === 'ganho' ? `${safe} de ${H.inside} reféns ilesos` : `${H.hurt + H.dead} de ${H.inside} reféns feridos ou em risco`;
  return G.frame === 'ganho' ? `~${H.inside} reféns no interior (sem confirmar quantos estão ilesos)` : `~${H.inside} reféns no interior (sem confirmar quantos estão em risco)`;
};

/* ---------- Orçamento: estoque + fluxo ---------- */
const FIELD_MIN_TAT = 5;   // a distribuição automática só põe em campo quem tem Tática ≥ 5
function budgetForecast(ids = G.team) {
  const nField = ids.filter(id => stat(id, 'tat') >= FIELD_MIN_TAT).length;
  const per = plantaoCost(nField), total = per * MAX_ROUNDS, free = G.credits - total;
  const intelAvg = Math.round(INTEL.reduce((s, i) => s + i.custo, 0) / INTEL.length);
  return { nField, per, total, free, intels: Math.max(0, Math.floor(free / intelAvg)), apoios: Math.max(0, Math.floor(free / APOIO_PRECOS[0])) };
}
/* Para onde foi o dinheiro: categorias do estoque inicial de 1.000 créditos */
function spendBreakdown() {
  const sp = G.spent, cut = sp.corte || 0;
  const cats = [
    { k: 'Equipe', v: sp.rec, c: 'var(--blue)' }, { k: 'Equipamento', v: sp.equip, c: 'var(--violet)' },
    { k: 'Inteligência', v: sp.intel, c: 'var(--green)' }, { k: 'Plantão', v: sp.plantao, c: 'var(--amber)' },
    { k: 'Apoio e extras', v: sp.ops, c: 'var(--orange)' }
  ];
  if (cut > 0) cats.push({ k: 'Corte do banco', v: cut, c: 'var(--red)' });
  cats.push({ k: 'Reserva', v: Math.max(0, G.credits), c: 'var(--line2)' });
  return cats;
}

/* ---------- Capacidade da equipe: quantas zonas ela cobre bem, com a distribuição automática ---------- */
function capacityPreview() {
  if (!G.team.length) return { adq: 0, cov: ZONES.map(() => 0) };
  const sa = Object.assign({}, G.az), sg = Object.assign({}, G.gz), sp = G.pressure;
  G.pressure = calcPressure(); autoPlace();
  const zs = G.team.map(id => G.az[id]).filter(z => z && z !== 'reserva');
  G.gear.forEach((e, i) => { G.gz[e] = (['drone', 'sniper', 'termica'].includes(e) && zs.length) ? zs[i % zs.length] : 'reserva'; });
  const cov = ZONES.map(z => zoneCoverage(z.id));
  G.az = sa; G.gz = sg; G.pressure = sp;
  return { adq: cov.filter(c => c >= ADEQ).length, cov };
}

/* ---------- Cofre: previsão numérica (o painel só mostra se o jogador já souber medir) ---------- */
function vaultEtaN() {
  const vm = PR_().vault * D_().vault, n = agentsIn('entrada').length, delta = Math.max(0, 10 * vm - 4 * n);
  return delta <= 0 ? Infinity : Math.ceil((100 - G.vault) / delta);
}

/* ---------- Prévia de reposicionamento: o custo antes de assumir ---------- */
function reposPreview(id, z) {
  const from = G.az[id] || 'reserva', zones = [from, z].filter(x => x !== 'reserva');
  const snap = () => Object.fromEntries(zones.map(x => [x, zoneCoverage(x)]));
  const before = snap(), oldAz = G.az[id], oldTr = G.transit[id];
  const free = z === 'reserva' || hasGear('viatura') || id === 'lucas';
  G.az[id] = z; G.transit[id] = free ? 0 : 2; const now = snap();
  G.transit[id] = free ? 0 : 1; const next = snap();
  G.az[id] = oldAz; G.transit[id] = oldTr;
  return { from, z, before, now, next, free };
}

/* ---------- Prévia do plano da rodada (o que as ordens vão mudar, só com números que o jogador já enxerga) ---------- */
function planPreview() {
  const q = G.queue; if (!q.length) return [];
  const rows = [], D = D_(), spent = q.reduce((s, d) => s + (d.cost || 0), 0), pl = plantaoCost();
  const avgCov = () => ZONES.reduce((s, z) => s + zoneCoverage(z.id), 0) / ZONES.length;
  // aplica as ordens táticas, mede, e desfaz
  const sAz = Object.assign({}, G.az), sTr = Object.assign({}, G.transit), sSup = JSON.parse(JSON.stringify(G.support));
  const c0 = ZONES.map(z => zoneCoverage(z.id)), a0 = avgCov();
  q.filter(d => d.kind === 'repos').forEach(d => {
    const free = d.p.zone === 'reserva' || hasGear('viatura') || d.p.agent === 'lucas';
    G.az[d.p.agent] = d.p.zone; G.transit[d.p.agent] = free ? 0 : 2;
  });
  q.filter(d => d.kind === 'apoio').forEach(d => { G.support[d.p.zone] = { v: 25, left: 2 }; });
  const c1 = ZONES.map(z => zoneCoverage(z.id)), a1 = avgCov(), nEnt = agentsIn('entrada').length;
  const vm = PR_().vault * D.vault, vd = Math.max(0, 10 * vm - 4 * nEnt), moved = q.filter(d => d.kind === 'repos').length;
  G.az = sAz; G.transit = sTr; G.support = sSup;
  rows.push({ k: 'Créditos', a: G.credits + spent, b: G.credits - pl, f: v => Math.round(v), goodUp: true, note: `${spent ? '−' + spent + ' das ordens, ' : ''}−${pl} de plantão` });
  if (moved || q.some(d => d.kind === 'apoio')) {
    const worst = ZONES.map((z, i) => ({ z, d: c1[i] - c0[i], a: c0[i], b: c1[i] })).filter(x => Math.abs(x.d) >= 5).sort((x, y) => Math.abs(y.d) - Math.abs(x.d)).slice(0, 3);
    rows.push({ k: 'Cobertura média (7 zonas)', a: a0, b: a1, f: v => Math.round(v) + '%', goodUp: true, note: worst.map(w => `${w.z.curto} ${w.a}→${w.b}%`).join(' · ') + (moved ? ' · quem se desloca rende 50%' : '') });
  }
  const cm = q.filter(d => d.kind === 'com').reduce((s, d) => s + (d.p.cid === 'geral' ? -3 : d.p.cid === 'coletiva' ? -5 : 0), 0);
  const mg = (8 + G.round * 2) * D.media + cm - (hasGear('jammer') ? 2 : 0);
  const lkMax = Math.max(0, ...q.filter(d => d.kind === 'com').map(d => leakChance(d.p.cid)));
  rows.push({ k: 'Pressão da mídia', a: G.media, b: clamp(G.media + mg, 0, 100), f: v => Math.round(v), goodUp: false, note: cm ? `comunicado ${cm}${lkMax > 0 ? ` (${Math.round(lkMax * 100)}% de risco de vazar: aí sobe +10)` : ''}` : 'sem comunicado, a mídia sobe sozinha' });
  if (G.K.vault) rows.push({ k: 'Cofre', a: G.vault, b: clamp(G.vault + vd, 0, 100), f: v => Math.round(v) + '%', goodUp: false, note: nEnt ? `${nEnt} na Entrada segura o ritmo` : 'sem ninguém na Entrada' });
  const nd = q.find(d => d.kind === 'nego');
  if (nd && nd.p.tech !== 'press') { const np = negoParts(nd.p.tech); rows.push({ k: 'Avanço na negociação', txt: pLabel(np.p), tone: pCls(np.p), note: np.compat ? 'postura compatível com o degrau' : np.skip ? 'pula etapa: metade da chance e risco de regredir' : 'consolida o degrau atual' }); }
  return rows;
}

/* ---------- Ultimato final (rodada 8): o que o comandante consegue estimar hoje ----------
   A faixa usa a mesma incerteza da intervenção: quanto menos se sabe, mais larga. */
function ultimatumView() {
  const p = ultimatumProb(), pf = intervProb(-.10), band = Math.max(.05, ivBand());
  return { p, pf, cede: pctRange(p, band), forca: pctRange(pf, band), tone: p >= .5 ? 'good' : p >= .25 ? 'warn' : 'bad' };
}

/* ---------- Ordem política (L2.3) ----------
   Com o prefeito perdido (15 ou menos) ao fim de uma rodada a partir da 6, ele determina a intervenção contra a recomendação técnica. É o
   desfecho mais comum de quem não comunica (23 a 68% das partidas do especialista que só negocia; 91 a 97% se ele também não negocia), e o
   aviso só chegava quando o prefeito já estava perdido, uma rodada antes. Aqui a mesma conta do fim de rodada (stakePassives) vira previsão:
   quanto ele perde por rodada e onde fecharia a rodada com e sem o relatório ao gabinete. */
function ordemPolitica() {
  const pf = G.stk.prefeito, r = G.round, perda = 2 + (r >= 6 ? 3 : 0) + (G.deadlineLeft > 0 ? 2 : 0), rel = Math.round(10 * commMult());
  const sem = Math.max(0, Math.round(pf.sat - 3 * Math.min(pf.sem + 1, 3) - perda)), com = Math.max(0, Math.round(pf.sat + rel - perda));
  if (r >= 6) {
    if (sem > 15) return null;
    return { sev: 3, sem, com, text: `Confiança ${Math.round(pf.sat)}. Sem ação ele fecha a rodada em ${sem}, abaixo do limite de 15, e ordena a entrada contra a sua recomendação técnica. Com o relatório ao gabinete (+${rel}) fecharia em ${com}${com <= 15 ? ': ainda no limite, só o relatório não basta' : ''}.` };
  }
  if (r < 4 || (pf.sat > 40 && !pf.lost)) return null;
  return { sev: r >= 5 ? 3 : 2, sem, com, text: `Confiança ${Math.round(pf.sat)}${pf.sem >= 2 ? `, ${pf.sem} rodadas sem atenção` : ''}. A partir da rodada 6, o prefeito que fecha uma rodada com 15 ou menos ordena a intervenção por conta própria, contra a sua recomendação. Um relatório ao gabinete sobe ${rel}; a partir da 6 ele perde ${5 + (G.deadlineLeft > 0 ? 2 : 0)} por rodada.` };
}

/* ---------- Alertas priorizados: o que olhar primeiro ---------- */
function siegeAlerts() {
  const out = [], K = G.K, r = G.round, left = MAX_ROUNDS - r, pa = perceivedAgit(), D = D_();
  const add = (sev, ic, title, text, tab, label) => out.push({ sev, ic, title, text, tab, label });
  if (!G.nego.contact && r >= 2) add(2, 'phone', 'Sem canal com o líder', `Há ${r - 1} rodada${r > 2 ? 's' : ''} ninguém fala com ele: você não mede a agitação nem sabe quem ele é.`, 'nego', 'Abrir negociação');
  if ((pa.exact && G.agit >= 70) || (!pa.exact && pa.v >= 70)) add(3, 'alert', pa.exact ? `Agitação ${Math.round(G.agit)}` : 'Agitação crítica', G.agit > 80 ? `Acima de 80 há ${Math.round((G.agit - 80) * 2 * D.desp)}% de risco por rodada de ação desesperada.` : 'Perto de 80 o líder pode agir por desespero. Pressão e movimentos bruscos pioram.', 'nego', 'Acalmar');
  if (G.credits < plantaoCost()) add(3, 'coin', 'Verba abaixo do plantão', `Reserva ${Math.round(G.credits)} para um plantão de ${plantaoCost()}. No vermelho, o banco perde 5 por rodada e, nas três primeiras, a pressão da equipe sobe 3.`, 'tatica', 'Mandar gente à reserva');
  else if (left > 0 && runway() < left) add(2, 'coin', 'A verba não vai até o fim', `Sustenta ${runway().toFixed(1).replace('.', ',')} de ${left} rodadas de plantão (falta ~${Math.round(burnToEnd() - G.credits)}). Cada ordem paga encurta mais.`, 'tatica', 'Rever efetivo');
  if (K.route && zoneCoverage(K.route) < ADEQ) add(3, 'road', `Rota provável descoberta`, `${ZONE[K.route].nome} está com ${zoneCoverage(K.route)}% de cobertura. Se o cofre ceder, é por ali que eles saem.`, 'tatica', 'Reforçar a zona');
  if (K.vault) { const e = vaultEtaN(); if (e <= 2) add(3, 'bank', 'Cofre perto de ceder', e <= 0 ? 'O cofre está a ponto de abrir.' : `Abre em ${e} rodada${e > 1 ? 's' : ''}. Agentes na Entrada seguram o ritmo, mas irritam o líder.`, 'tatica', 'Pressionar a Entrada'); else if (e <= 4) add(2, 'bank', `Cofre abre em ${e} rodadas`, 'Hoje ainda dá tempo de segurar o ritmo ou fechar a rota.', 'tatica', 'Ver a Entrada'); }
  else if (r >= 3 && G.lastVaultDelta >= 6) add(2, 'bank', 'Cofre avança sem medição', 'Há sinais de trabalho intenso, mas você não sabe quanto falta. A diretoria do banco entrega a planta.', 'com', 'Falar com o banco');
  const po = ordemPolitica();
  if (po) add(po.sev, 'mayor', 'Prefeito pode ordenar a entrada', po.text, 'com', 'Falar com o prefeito');
  const worst = STK_KEYS.filter(k => !(k === 'prefeito' && po) && (G.stk[k].sem >= 2 || G.stk[k].sat < 40)).sort((a, b) => G.stk[a].sat - G.stk[b].sat)[0];
  if (worst) add(G.stk[worst].sat < 25 ? 3 : 2, STK[worst].ic, `${STK[worst].nome} em risco`, `Confiança ${Math.round(G.stk[worst].sat)}${G.stk[worst].sem >= 2 ? `, ${G.stk[worst].sem} rodadas sem atenção` : ''}. Perder um stakeholder tem custo imediato.`, 'com', 'Comunicar');
  const tired = deployed().filter(id => ff(id) < .75);
  if (tired.length) add(2, 'tired', 'Equipe cansada', `${tired.length} em campo abaixo de 75% pela fadiga. Horas extras custam ${horasCost()}; rodízio custa cobertura.`, 'tatica', 'Horas extras ou rodízio');
  const away = G.team.filter(isAway);
  if (away.length) add(2, 'alert', 'Agente reconvocado', `${away.map(id => shortName(agentById(id).nome)).join(', ')} fora por mais ${Math.max(...away.map(id => G.away[id]))} rodada(s). As zonas deles estão abertas.`, 'tatica', 'Cobrir as zonas');
  if (G.pressure > 75) add(2, 'bolt', 'Equipe sobrecarregada', `Pressão ${G.pressure}: acima da zona ótima (≈50) a eficiência cai. A Pausa de Comando reduz 10.`, 'tatica', 'Subir à sacada');
  if (G.deadlineLeft > 0) add(3, 'clock', 'Noticiário das 20h', `Faltam ${G.deadlineLeft} rodada${G.deadlineLeft > 1 ? 's' : ''}. Se não houver desfecho, o prefeito perde 15 pontos.`, 'com', 'Falar com o prefeito');
  else if (r === 5 && !po) add(1, 'mayor', 'Prefeito em urgência na rodada 6', 'Perdas de confiança dele passam a ser maiores. Comunicar agora é mais barato que depois.', 'com', 'Antecipar');
  if (r === MAX_ROUNDS) { const u = ultimatumView(); add(3, 'clock', 'Última rodada', `Depois desta vem o ultimato final. Como está, o líder cede com ${u.cede} de chance; se não ceder, a entrada é forçada (${u.forca} de sucesso). O que você mexer agora ainda conta.`, 'nego', 'Fechar a negociação'); }
  else if (r >= MAX_ROUNDS - 2) { const u = ultimatumView(); add(1, 'clock', `Ultimato em ${left} rodada${left > 1 ? 's' : ''}`, `Se a crise chegasse ao ultimato como está, o líder cederia com ${u.cede} de chance. Degraus a mais, rotas fechadas e agitação baixa aumentam essa chance.`, 'nego', 'Subir a escada'); }
  if (G.nego.step === 5) add(1, 'check', 'Degrau 5 alcançado', `A rendição ocorre se a agitação cair abaixo de ${D.ret}${G.K.profile && G.nego.contact ? ` (hoje ${Math.round(G.agit)})` : ''}. Mantenha a pressão baixa.`, 'nego', 'Seguir negociando');
  const u = G.update; if (u && u.r === r && u.tocPrev && u.tocPrev !== u.toc) add(1, TOCS[u.toc].ic, `A restrição mudou: ${TOCS[u.toc].nome}`, `Antes era ${TOCS[u.tocPrev].nome.toLowerCase()}. ${TOCS[u.toc].elevar}`, TOCS[u.toc].tab, 'Elevar a restrição');
  const last = out.findIndex(a => a.title === 'Última rodada'); if (last > 0) out.unshift(out.splice(last, 1)[0]);   // a última rodada é o alerta mais urgente: fica no topo entre os críticos
  return out.sort((a, b) => b.sev - a.sev);
}

/* ---------- Marcos próximos (projeção que dá para agir) ---------- */
function milestones() {
  const out = [], r = G.round, K = G.K;
  if (K.vault) { const e = vaultEtaN(); if (isFinite(e)) out.push({ r: r + e, t: 'Cofre abre', tone: e <= 2 ? 'red' : 'amber' }); }
  if (r < 6) { const po = ordemPolitica(); out.push({ r: 6, t: po ? 'Prefeito pode ordenar a entrada' : 'Prefeito em urgência', tone: po ? 'red' : 'amber' }); }
  if (G.deadlineLeft > 0) out.push({ r: r + G.deadlineLeft, t: 'Jornal das 20h', tone: 'red' });
  if (G.nego.contact && G.nego.step < 5) { const pc = negoParts(G.nego.step).p, n = Math.ceil((5 - G.nego.step) / Math.max(.05, pc)); out.push({ r: r + n, t: 'Degrau 5 (se negociar todo turno)', tone: 'blue' }); }
  const bk = burnToEnd(); if (G.credits < bk && plantaoCost() > 0) out.push({ r: r + Math.floor(runway()), t: 'A verba acaba', tone: 'red' });
  { const u = ultimatumView(); out.push({ r: MAX_ROUNDS, t: `Ultimato final (cede com ${u.cede})`, tone: 'red' }); }
  return out.filter(m => m.r <= MAX_ROUNDS + 2).sort((a, b) => a.r - b.r);
}

/* ---------- Conquistas (selos) ----------
   Só leem o estado final da partida. Ficam fora da interface para a bancada de testes medir a frequência de cada selo com a função real. */
function badgeEarned(id) {
  const H = G.hostages, S = G.score, E = G.end, st = G.stats;
  switch (id) {
    case 'ninguem': return H.hurt + H.dead === 0;
    case 'escuta': return E.type === 'rendicao' && G.nego.concessions === 0 && !(st.press);
    case 'sacada': return st.pausas >= 2 && st.pausas <= 3 && S.total >= 50;
    case 'aposta': return (st.initCov[G.route] || 0) >= ADEQ && !st.routeKnownAtStart;
    case 'olhos': return knownCount() >= 5;
    case 'cofre': return G.vault < 40;
    case 'economia': return G.credits >= 400;
    case 'porta': return st.comms >= 3 && STK_KEYS.every(k => G.stk[k].sat >= DIFF[G.diff].porta);
    case 'degraus': return G.nego.maxStep >= 4 && G.nego.skips === 0;
    case 'rodizio': return st.minFF >= .7;
    case 'equilibrio': return [S.vidas, S.captura, S.valores, S.confianca].every(x => x > .6) && S.eficiencia > .3;
    case 'mao': return E.type === 'intervencao' && ['limpa', 'baixas'].includes(E.variant) && H.hurt + H.dead === 0 && !(E.agentsHurt || []).length;
  }
  return false;
}

const fmt = n => Math.round(n).toLocaleString('pt-BR');

/* ---------- Avisos (toasts) ----------
   Ficam no canto inferior esquerdo, acima da barra de ação, longe da coluna de decisões.
   Passar o mouse pausa a saída; o ✕ fecha na hora. O rádio da rodada não vira toast: ele já está na tela de atualização. */
function toast(title, text, tone = '') {
  const box = document.getElementById('toasts'); if (!box) return;
  if ([...box.children].some(c => c.dataset.t === text)) return;
  const el = document.createElement('div'); el.className = 'toast ' + tone; el.dataset.t = text;
  el.innerHTML = `<b>${title}</b>${text}<button class="tx" type="button" aria-label="Fechar aviso">✕</button>`; box.appendChild(el);
  while (box.children.length > 3) box.removeChild(box.firstChild);
  const kill = () => { if (el.parentNode) el.parentNode.removeChild(el); };
  el.addEventListener('animationend', e => { if (e.animationName === 'toastout') kill(); });
  el.querySelector('.tx').addEventListener('click', kill);
  setTimeout(kill, 20000);
}

/* ---------- Timer ---------- */
/* Pacing: as duas primeiras rodadas são de orientação e dão mais tempo para ler o painel. */
const roundTimer = () => Math.round(D_().timer * (G.round === 1 ? 1.6 : G.round === 2 ? 1.25 : 1));
const timeLeft = () => Math.max(0, Math.ceil((UI.deadline - Date.now()) / 1000));
function stopTimer() { if (UI.timerId) { clearInterval(UI.timerId); UI.timerId = null; } UI.paused = false; }
function startTimer() {
  stopTimer(); UI.timerRound = G.round;
  if (G.noLimit) { UI.deadline = 0; return; }
  /* G.tleft guarda o que sobrava no relógio: recarregar a página ou voltar à aba continua de onde parou, em vez de dar a rodada inteira de novo. */
  const left = G.tleft != null ? Math.max(10, G.tleft) : roundTimer();
  UI.deadline = Date.now() + left * 1000;
  UI.timerId = setInterval(tick, 250); tick();
}
function tick() {
  if (!UI.timerId) return;
  const left = timeLeft(), el = document.getElementById('clock'); G.tleft = left;
  if (el) { el.textContent = mmss(left); el.classList.toggle('low', left <= 30); }
  if (left <= 0) { stopTimer(); toast('COMANDO', 'Tempo esgotado: o plano atual é executado.', 'hot'); run(() => ACT.execute({})); }
}
/* Aba oculta ou janela de confirmação aberta: o relógio espera. O jogo é de um jogador só, e sair da aba não deve executar o plano às cegas. */
function pauseTimer() { if (!UI.timerId) return; G.tleft = timeLeft(); stopTimer(); UI.paused = true; saveGame(); }
function resumeTimer() { if (UI.paused && !UI.menuConfirm && G && G.phase === 'siege' && G.stage === 'panel') startTimer(); }

function skyline() {
  let seed = 7; const r = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  let x = 0, out = '';
  while (x < 1600) {
    const w = 50 + r() * 90, h = 90 + r() * 330;
    out += `<rect x="${x}" y="${600 - h}" width="${w}" height="${h}" fill="${r() > .5 ? '#0c1527' : '#0a1220'}"/>`;
    for (let wy = 600 - h + 14; wy < 580; wy += 22) for (let wx = x + 8; wx < x + w - 10; wx += 16) if (r() > .72) out += `<rect class="win" style="animation-delay:${(r() * 6).toFixed(1)}s" x="${wx}" y="${wy}" width="6" height="9" fill="${r() > .85 ? '#f6a623' : '#c9a85a'}" opacity="${(.35 + r() * .5).toFixed(2)}"/>`;
    if (r() > .8) out += `<rect x="${x + w / 2 - 1}" y="${600 - h - 26}" width="2" height="26" fill="#0c1527"/><circle cx="${x + w / 2}" cy="${600 - h - 28}" r="2.5" fill="#ff3b4f" class="win"/>`;
    x += w + 4 + r() * 12;
  }
  return `<svg class="skyline" viewBox="0 0 1600 600" preserveAspectRatio="xMidYMax slice" aria-hidden="true">${out}</svg>`;
}

/* ---------- Sparkline ---------- */
function spark(series, color, proj) {
  const W = 220, Hh = 46, n = Math.max(series.length, 1) + (proj ? 2 : 0);
  const X = i => 6 + (W - 14) * (n <= 1 ? 0 : i / (n - 1)), Y = v => Hh - 6 - (Hh - 12) * clamp(v, 0, 100) / 100;
  if (!series.length) return `<svg class="spark" viewBox="0 0 ${W} ${Hh}" aria-hidden="true"><path d="M6 ${Hh - 6}H${W - 8}" stroke="var(--line)" /></svg>`;
  const pts = series.map((v, i) => `${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' ');
  const last = series[series.length - 1], prev = series.length > 1 ? series[series.length - 2] : last;
  const tr = last - prev, pEnd = clamp(last + tr * 2, 0, 100);
  const area = `${X(0).toFixed(1)},${Hh - 6} ${pts} ${X(series.length - 1).toFixed(1)},${Hh - 6}`;
  return `<svg class="spark" viewBox="0 0 ${W} ${Hh}" aria-hidden="true"><path d="M6 ${Hh - 6}H${W - 8}M6 ${Y(50)}H${W - 8}" stroke="var(--line)" stroke-width="1"/>
    <polygon points="${area}" fill="${color}" opacity=".12"/><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round"/>
    ${proj ? `<path d="M${X(series.length - 1).toFixed(1)} ${Y(last).toFixed(1)} L${X(series.length + 1).toFixed(1)} ${Y(pEnd).toFixed(1)}" stroke="${color}" stroke-width="2" stroke-dasharray="3 3" fill="none"/>` : ''}
    <circle cx="${X(series.length - 1).toFixed(1)}" cy="${Y(last).toFixed(1)}" r="3.5" fill="${color}"/></svg>`;
}
const ins = (tone, ic, text) => `<div class="insight ${tone}">${icon(ic, '', 1.8)}<span>${text}</span></div>`;

/* ---------- Painel de Endsley ---------- */
function endsleyHTML() {
  const K = G.K, H = G.hostages, pa = perceivedAgit(), pv = perceivedVault(), P = PR_();
  const unk = t => `<span class="unk">${t}</span>`;
  const hid = [

  ];
  const u = G.update, reps = u && u.r === G.round ? u.reports : [];
  const l1 = `
    <div class="kv">
      <div><small>Pressão da mídia</small><b>${Math.round(G.media)}</b></div>
      <div><small>Agitação aparente</small><b>${pa.txt}</b></div>
      <div><small>Cofre (atividade)</small>${pv.exact ? `<b>${pv.txt}</b>` : `<b>${pv.txt}</b>`}</div>
      <div><small>Degrau da negociação</small><b>${G.nego.step} / 5</b></div>
    </div>
    <p style="font-size:13.5px;margin-top:2px;font-family:var(--serif)">${hostagesFramed()}.</p>
    <div class="eyebrow">Variáveis ocultas</div>
    <div class="kv">${hid.map(([k, v]) => `<div><small>${k}</small>${v == null ? unk('desconhecido') : `<b style="font-size:14px">${v}</b>`}</div>`).join('')}</div>
    <div class="eyebrow">Relatos de campo desta rodada</div>
    <div>${reps.length ? reps.map(r => `<div class="report"><span class="src">${r.ag} · ${ZONE[r.z].curto}</span><span>${r.txt}. <span class="faint">Confiança ${r.conf}.</span></span></div>`).join('') : '<p class="faint" style="font-size:12.5px">Nenhum relato: zonas sem agentes não geram relatos. Você só ouve onde posiciona gente para ouvir.</p>'}</div>`;
  // Nível 2
  const toc = tocConstraint(), fpAvg = deployed().length ? deployed().reduce((s, id) => s + fp(id), 0) / deployed().length : pressureFactor(G.pressure);
  const zone = G.pressure < 30 ? 'baixa demais (complacência)' : G.pressure <= 62 ? 'zona ótima' : G.pressure <= 75 ? 'alta (desempenho caindo)' : 'sobrecarga';
  const L2 = [];
  L2.push(ins(G.pressure > 75 || G.pressure < 30 ? 'bad' : G.pressure > 62 ? 'warn' : 'good', 'bolt', `Pressão operacional ${G.pressure}: ${zone}. Eficiência média dos agentes ${Math.round(fpAvg * 100)}% do potencial (curva de Yerkes-Dodson).`));
  const st = STEPS[G.nego.step - 1];
  L2.push(ins('info', 'phone', `Negociação no degrau ${G.nego.step} (${st.nome}). ${K.profile ? `Líder ${P.nome}: ${P.tip}` : G.nego.signalShown ? `Sinal do canal: “${P.sign}”` : 'O perfil do líder ainda é desconhecido, e a postura certa depende dele.'}`));

/* ---------- Resolução / feedback ---------- */
function deltaCell(label, a, b, fmtF, goodUp, cls, noBar) {
  const diff = b - a, arrow = Math.abs(diff) < .5 ? '→' : diff > 0 ? '↑' : '↓';
  const bad = Math.abs(diff) >= .5 && ((diff > 0) !== goodUp);
  return `<div class="dcell"><div class="top"><span>${label}</span><b class="${Math.abs(diff) < .5 ? '' : bad ? 'up' : 'dn'}">${fmtF(a)} ${arrow} ${fmtF(b)}</b></div>${noBar ? '' : `<div class="meter ${cls}"><i style="width:${clamp(a, 0, 100)}%" data-to="${clamp(b, 0, 100)}"></i></div>`}</div>`;
}
/* Causa → efeito: cada fator empurra para cima (vermelho) ou para baixo (verde). Sob névoa, só a direção. */
function waterfall(title, parts, exact, upBad = true) {
  const ps = (parts || []).filter(p => Math.abs(p.v) >= .05); if (!ps.length) return '';
  const mx = Math.max(10, ...ps.map(p => Math.abs(p.v))), tot = ps.reduce((s, p) => s + p.v, 0);
  const mag = v => Math.abs(v) < 2 ? 'leve' : Math.abs(v) < 6 ? 'moderado' : 'forte';
  return `<div class="wf"><div class="eyebrow">${title}</div>${ps.map(p => {

const DIM_LOSS = { Vidas: 'reféns feridos ou mortos', Prisões: 'assaltantes que não foram presos', Valores: 'perda do cofre', Eficiência: 'verba gasta e duração da crise', Confiança: 'stakeholders insatisfeitos', Penalidade: 'agentes feridos em ação' };
function nextGradeHint(S, dims) {
  const nx = GRADE_NEXT[S.grade]; if (!nx || S.capped) return '';
  const loss = dims.map(d => ({ k: d.k, l: (1 - d.v) * d.w * 100 })).concat(S.penal ? [{ k: 'Penalidade', l: S.penal }] : []).sort((a, b) => b.l - a.l).slice(0, 2);
  const eff = loss[0].k === 'Eficiência' && nx[0] === 'S' ? ' O S pede verba sobrando, mas equipe enxuta demais custa proteção em crises difíceis.' : '';
  const gap = nx[1] - S.total;
  return `${gap <= 1 ? 'Faltou' : 'Faltaram'} ${dec(gap)} ${gap <= 1 ? 'ponto' : 'pontos'} para a nota ${nx[0]}. Onde mais se perdeu: ${loss.map(x => `${x.k} (−${dec(x.l)} pts: ${DIM_LOSS[x.k]})`).join('; ')}.${eff}`;
}
function scoreHTML() {
  const S = G.score, H = G.hostages, E = G.end;
  const dims = [
    { k: 'Vidas', v: S.vidas, w: .40, why: `${H.dead} ${plural(H.dead, 'morto', 'mortos')} e ${H.hurt} ${plural(H.hurt, 'ferido', 'feridos')} entre ${HOSTAGES} reféns (cada morte tira 14,7 pontos da dimensão e cada ferido 2,9: o −25 e o −5 do documento, proporcionais aos 17 reféns).${G.stats.kitSaves ? ` O kit médico evitou ${G.stats.kitSaves} ${plural(G.stats.kitSaves, 'morte', 'mortes')}.` : ''}` },
    { k: 'Prisões', v: S.captura, w: .20, why: `${outName(E)}: ${Math.round(S.captura * 100)}% dos responsáveis presos.` },
    { k: 'Valores', v: S.valores, w: .15, why: `Cofre em ${Math.round(G.vault)}% no desfecho; fator de perda do desfecho ${String(E.lootF).replace('.', ',')}.` },
    { k: 'Eficiência', v: S.eficiencia, w: .10, why: `${fmt(G.credits)} créditos sobraram e a crise durou ${G.round} rodadas. O plantão custou ${fmt(G.spent.plantao)} no total${G.deficit ? ` e ${G.deficit} ${plural(G.deficit, 'rodada', 'rodadas')} ficaram no vermelho` : ''}.` },
    { k: 'Confiança', v: S.confianca, w: .15, why: `Média ponderada dos stakeholders: ${STK_KEYS.map(k => `${STK[k].nome} ${Math.round(G.stk[k].sat)}`).join(' · ')}.` }
  ];
  const hint = nextGradeHint(S, dims);
  return `<div class="scorehead"><div style="text-align:center">${radarSVG(dims)}</div>
    <div class="grid" style="gap:10px"><div class="eyebrow">Nota final</div><h1 class="sr">Pontuação final: nota ${S.grade}, ${dec(S.total)} de 100</h1><div class="grade ${S.grade}" aria-hidden="true">${S.grade}</div><div class="bigscore" aria-hidden="true">${dec(S.total)} / 100</div>
    ${S.capped ? `<div class="insight warn">${icon('alert', '', 1.8)}<span>Teto aplicado: a pontuação bruta (${dec(S.raw)}) foi limitada a ${S.cap} ${capReason(S, H, E)}</span></div>` : ''}
    ${S.penal ? `<div class="insight bad">${icon('alert', '', 1.8)}<span>Penalidade: −${S.penal} pontos por ${E.agentsHurt.length} ${plural(E.agentsHurt.length, 'agente ferido', 'agentes feridos')} em ação (${E.agentsHurt.map(id => shortName(agentById(id).nome)).join(', ')}). Quem protege também conta os próprios.</span></div>` : ''}
    <p class="muted" style="max-width:520px">${S.grade === 'S' ? 'Operação exemplar.' : S.grade === 'A' ? 'Excelente condução, com pouco a corrigir.' : S.grade === 'B' ? 'Boa condução, com trade-offs visíveis.' : S.grade === 'C' ? 'Resultado aceitável, mas com perdas evitáveis.' : S.grade === 'D' ? 'Resultado fraco: as decisões se acumularam contra você.' : 'Operação malsucedida. A falha também ensina: veja o debrief.'}</p>
    ${hint ? `<p class="faint" style="max-width:520px;font-size:13px">${hint}</p>` : ''}</div></div>
    <div class="card" style="margin-top:18px"><h2 class="h3">Composição</h2>${dims.map(d => `<div class="dimrow"><div><b>${d.k}</b><small>peso ${Math.round(d.w * 100)}%</small></div><div><div class="meter tall ${d.v >= .7 ? 'g' : d.v >= .4 ? 'a' : 'r'}"><i style="width:0%" data-to="${Math.round(d.v * 100)}"></i></div><small class="faint">${d.why}</small></div><div class="mono" style="text-align:right">${Math.round(d.v * 100)}% → ${dec(d.v * d.w * 100)} pts</div></div>`).join('')}</div>`;
}

/* ---------- Replay ---------- */
function chartSVG() {
  const h = G.hist; if (!h.length) return '';
  const W = 720, Hh = 220, L = 38, B = 28, n = MAX_ROUNDS;
  const X = r => L + (W - L - 14) * (r - 1) / (n - 1), Y = v => Hh - B - (Hh - B - 12) * clamp(v, 0, 100) / 100;
  const line = (k, c, dash) => `<polyline points="${h.map(p => `${X(p.r).toFixed(1)},${Y(p[k]).toFixed(1)}`).join(' ')}" fill="none" stroke="${c}" stroke-width="2.5" ${dash ? 'stroke-dasharray="5 4"' : ''} stroke-linejoin="round"/>${h.map(p => `<circle cx="${X(p.r).toFixed(1)}" cy="${Y(p[k]).toFixed(1)}" r="3.5" fill="${c}"/>`).join('')}`;
  return `<div class="scroll-x"><svg viewBox="0 0 ${W} ${Hh}" style="min-width:560px;width:100%;height:auto" role="img" aria-label="Evolução de agitação, mídia, cofre e pressão da equipe por rodada">
    ${[0, 25, 50, 75, 100].map(v => `<path d="M${L} ${Y(v)}H${W - 14}" stroke="var(--line)"/><text x="${L - 6}" y="${Y(v) + 4}" text-anchor="end" fill="var(--ink3)" font-size="10.5" font-family="IBM Plex Mono,monospace">${v}</text>`).join('')}
    ${Array.from({ length: n }, (_, i) => `<text x="${X(i + 1)}" y="${Hh - 8}" text-anchor="middle" fill="var(--ink3)" font-size="11">R${i + 1}</text>`).join('')}
    ${line('agit', '#ff5468')}${line('media', '#f6a623')}${line('vault', '#4da6ff')}${line('p', '#a78bfa', true)}</svg></div>
    <div class="legend"><span><i style="background:#ff5468"></i>Agitação do líder</span><span><i style="background:#f6a623"></i>Pressão da mídia</span><span><i style="background:#4da6ff"></i>Cofre</span><span><i style="background:#a78bfa"></i>Pressão da equipe</span></div>`;
}
function replayHTML() {
  const r = clamp(UI.replayR, 1, Math.max(1, G.log.length)), rec = G.log[r - 1];
  const nodes = Array.from({ length: MAX_ROUNDS }, (_, i) => { const l = G.log[i]; return l ? `<button class="tnode" role="tab" data-act="rnode" data-r="${i + 1}" aria-selected="${r === i + 1}" tabindex="${r === i + 1 ? 0 : -1}"><b>R${i + 1}</b>${l.time}<br><span class="faint">${l.decs.length} ${plural(l.decs.length, 'decisão', 'decisões')}${l.ev ? ' · evento' : ''}</span></button>` : `<div class="tnode na" aria-label="Rodada ${i + 1}: não jogada"><b>R${i + 1}</b>não jogada</div>`; }).join('');
  const d = rec ? `<div class="card"><h2 class="h3">Rodada ${r} · ${rec.time}</h2>
    <div class="row" style="margin-bottom:10px">${rec.decs.length ? rec.decs.map(x => `<span class="pill blue">${icon(FRONT_IC[x.front], 'ico" style="width:14px;height:14px')}${x.label}</span>`).join('') : '<span class="muted">Sem decisões.</span>'}</div>
    ${rec.ev ? `<div class="insight warn" style="margin-bottom:10px">${icon(EVDEF[rec.ev.id].ic, '', 1.8)}<span><b>${EVDEF[rec.ev.id].titulo}</b>: ${rec.ev.choice}</span></div>` : ''}
    <div class="grid" style="gap:6px">${rec.lines.map(l => `<div class="res-line ${l.tone}" style="animation:none">${icon(l.ic, '', 1.8)}<span>${br(l.text)}</span></div>`).join('')}</div>
    <div class="delta" style="margin-top:12px">${[['Agitação', rec.s0.agit, rec.s1.agit], ['Mídia', rec.s0.media, rec.s1.media], ['Cofre', rec.s0.vault, rec.s1.vault], ['Pressão da equipe', rec.s0.p, rec.s1.p], ...STK_KEYS.map(k => [STK[k].nome, rec.s0.stk[k], rec.s1.stk[k]])].map(([k, a, b]) => `<div class="dcell"><div class="top"><span>${k}</span><b>${Math.round(a)} → ${Math.round(b)}</b></div></div>`).join('')}</div></div>` : '';

/* ---------- Debrief: dinheiro e gargalos (L1.3) ---------- */
function tocRuns() {
  const runs = [];
  for (let r = 1; r <= G.round; r++) { const k = G.tocLog[r]; if (!k) continue; const l = runs[runs.length - 1]; if (l && l.k === k) l.to = r; else runs.push({ k, from: r, to: r }); }
  return runs;
}
const runTxt = runs => runs.map(x => `${TOCS[x.k].nome} (${x.from === x.to ? 'R' + x.from : 'R' + x.from + '–R' + x.to})`).join(' → ');
function tocAlign() {
  const L = G.spendLog, n = L.length, hit = L.filter(x => x.hit).length, cost = L.reduce((s, x) => s + x.cost, 0), costHit = L.filter(x => x.hit).reduce((s, x) => s + x.cost, 0);
  return { n, hit, cost, costHit, pct: n ? Math.round(hit / n * 100) : 0 };
}
function econHTML() {
  const cats = spendBreakdown(), tot = cats.reduce((a, c) => a + c.v, 0) || 1, sp = G.spent, runs = tocRuns(), al = tocAlign();
  const decis = sp.ops + sp.intel;
  const verdict = !al.n ? 'Você não fez ordens de informação, pessoal ou tempo: a restrição passou sem que você a atacasse.'
    : al.pct >= 60 ? `${al.hit} de ${al.n} ordens de recurso foram direto no elo mais fraco do momento (${al.costHit} de ${al.cost} créditos). Você subordinou o gasto à restrição.`
    : al.pct >= 30 ? `${al.hit} de ${al.n} ordens miraram o gargalo do momento. O restante foi para pontos que já não eram o elo mais fraco.`
    : `Só ${al.hit} de ${al.n} ordens miraram o gargalo do momento. Muito esforço foi para onde a corrente já era forte.`;
  return `<div class="card econ"><h2 class="h3">Dinheiro e gargalos: o que a operação custou</h2>
    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:20px">
      <div><div class="eyebrow">Para onde foram os 1.000 créditos</div>
        <div class="stack" style="margin-top:8px" role="img" aria-label="Distribuição dos gastos">${cats.filter(c => c.v > 0).map(c => `<i style="width:${c.v / tot * 100}%;background:${c.c}" title="${c.k}: ${Math.round(c.v)}"></i>`).join('')}</div>
        <div class="stackleg">${cats.filter(c => c.v > 0).map(c => `<span><i style="background:${c.c}"></i>${c.k} <b class="mono">${Math.round(c.v)}</b></span>`).join('')}</div>

});
CHG.repoagent = when(panel, v => { UI.repoAgent = v; render(); }); CHG.repozone = when(panel, v => { UI.repoZone = v; render(); }); CHG.apoiozone = when(panel, v => { UI.apoioZone = v; });
CHG.negotiator = when(panel, v => { G.nego.negotiator = G.team.includes(v) ? v : null; saveGame(); render(); });
ACT.addapoio = when(panel, () => { if (!UI.apoioZone) { warn('Escolha a zona do apoio externo.'); return; } addD({ front: 'tatica', kind: 'apoio', p: { zone: UI.apoioZone }, label: `Apoio externo em ${ZNAME(UI.apoioZone)}`, slots: 1, cost: apoioCost() }); });
ACT.addpausa = () => addD({ front: 'tatica', kind: 'pausa', p: {}, label: 'Pausa de Comando', slots: 1 });
ACT.addhoras = () => addD({ front: 'tatica', kind: 'horas', p: {}, label: 'Horas extras', slots: 1, cost: horasCost() });
ACT.iv = when(panel, () => { UI.ivConfirm = true; render(); focusFirst('[data-act=ivno]'); });
ACT.ivno = when(panel, () => { UI.ivConfirm = false; render(); focusFirst('[data-act=iv]'); });
ACT.ivyes = when(panel, () => { UI.ivConfirm = false; addD({ front: 'tatica', kind: 'interv', p: {}, label: 'INTERVENÇÃO', slots: D_().slots }); focusFirst('[data-act=iv]'); });
ACT.addnego = d => { if (!panel()) return; const t = d.t === 'press' ? 'press' : +d.t; if (t !== 'press' && !(t >= 1 && t <= 5)) return; addD({ front: 'nego', kind: 'nego', p: { tech: t }, label: t === 'press' ? 'Pressionar o líder' : `Negociar: ${POSTURES[t - 1].nome}`, slots: 1 }); };
ACT.addintel = d => { const it = INTEL.find(i => i.id === d.id); if (panel() && it) addD({ front: 'intel', kind: 'intel', p: { id: d.id }, label: it.nome, slots: 1, cost: intelCost(d.id) }); };
ACT.addcom = d => { const c = COMMS.find(x => x.id === d.id); if (panel() && c) addD({ front: 'com', kind: 'com', p: { cid: d.id }, label: c.nome, slots: 1, cost: c.custo }); };
ACT.rmq = when(panel, (d, el) => { removeDecision(+d.id); saveGame(); render(); if (el) focusFirst('.actbar .qx', '.actbar [data-act=execute]'); });
ACT.zonepick = when(panel, d => { if (!isZoneId(d.z)) return; UI.pickZone = d.z; UI.tab = 'tatica'; UI.repoZone = d.z; UI.apoioZone = d.z; render(); });
ACT.execute = when(panel, () => {
  stopTimer(); G.tleft = null; UI.ivConfirm = false; resolveDecisions(); render();
});
ACT.evchoice = when(() => at('siege', 'event'), d => { if (!chooseEvent(+d.i)) { warn('Créditos insuficientes para essa escolha.'); return; } render(); });
ACT.cont = when(() => at('siege', 'result'), () => {
  if (G.end) { const tb = document.getElementById('toasts'); if (tb) tb.innerHTML = ''; G.phase = 'outcome'; saveGame(); render(); return; }
  startRound(); render();
});
ACT.toscore = when(() => at('outcome'), () => { G.phase = 'post'; UI.post = 'score'; saveGame(); render(); });
ACT.ptab = when(() => at('post'), d => { UI.post = d.t; render(); });
ACT.rnode = when(() => at('post'), d => { UI.replayR = +d.r; render(); });
ACT.again = when(() => at('post'), () => { clearSave(); resetUI(); G = null; render(); });
ACT.tomenu = when(() => at('post'), () => { resetUI(); G = null; render(); });
/* Tela de falha: as três saídas funcionam em qualquer estado. */
ACT.fatalresume = () => { const s = loadSave(); resetUI(); G = s; render(); };
ACT.fatalmenu = () => { resetUI(); G = null; render(); };
ACT.fataldrop = () => { clearSave(); resetUI(); G = null; render(); };

/* ===================================================================
   RENDER / BOOT
   =================================================================== */
let lastKey = '', BAR = '';
const setBar = h => { BAR = h; };
const T0 = Date.now();
const reduceMotion = () => !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
/* Assinatura do elemento focado, para devolver o foco depois do re-render (o innerHTML troca todos os nós). */
const FOCUS_KEYS = ['t', 'id', 'v', 'z', 'i', 'r'];
function focusSig(el) {
  if (!el || el === document.body || !$app.contains(el)) return null;
  let sel = null;
  if (el.id) sel = '#' + CSS.escape(el.id);
  else if (el.dataset && el.dataset.act) sel = `[data-act="${el.dataset.act}"]` + FOCUS_KEYS.filter(k => el.dataset[k] != null).map(k => `[data-${k}="${CSS.escape(el.dataset[k])}"]`).join('');
  if (!sel) return null;
  return { sel, i: [...$app.querySelectorAll(sel)].indexOf(el) };
}
function restoreFocus(sig, changed) {
  const modal = $app.querySelector('.cut, .modalback');
  if (modal) {
    if (!modal.contains(document.activeElement)) { const d = modal.querySelector('[role=dialog]') || modal; d.setAttribute('tabindex', '-1'); d.focus({ preventScroll: true }); }
    return;
  }
  let el = null;
  if (!changed && sig) { const all = $app.querySelectorAll(sig.sel); el = all[sig.i] || all[0] || null; }
  if (!el && (changed || sig)) { el = $app.querySelector('h1'); if (el) el.setAttribute('tabindex', '-1'); }
  if (el && el !== document.activeElement) el.focus({ preventScroll: true });
}
/* Medidores e números que mudaram desde o último render deslizam do valor antigo para o novo. */
function tweenChanged(prev) {
  $app.querySelectorAll('[data-k]').forEach(el => {
    const p = prev[el.dataset.k]; if (p == null) return;
    if (el.dataset.val != null) {
      const i = el.querySelector('i'); if (!i || +p === +el.dataset.val) return;
      const to = i.style.width; i.style.transition = 'none'; i.style.width = clamp(+p, 0, 100) + '%'; void i.offsetWidth; i.style.transition = ''; i.style.width = to;
      el.classList.add('chg');
    } else if (el.dataset.n != null) {
      const a = +p, b = +el.dataset.n; if (a === b || !isFinite(a) || !isFinite(b)) return;
      const t0 = performance.now();
      el.classList.add('chg');
      const step = now => { const t = Math.min(1, (now - t0) / 700), e = 1 - Math.pow(1 - t, 3); el.textContent = fmt(a + (b - a) * e); if (t < 1 && el.isConnected) requestAnimationFrame(step); };
      requestAnimationFrame(step);
    }
  });
}
/* Monta o HTML da tela atual sem tocar na página: o desenho de verdade e a prova de que um save monta (ACT.continue) usam a mesma função. */
function buildScreen() {
  BAR = '';
  let html;
  if (!G) html = renderMenu();
  else if (G.phase === 'briefing') html = renderBriefing();
  else if (G.phase === 'recruit') html = renderRecruit();
  else if (G.phase === 'perimeter') html = renderPerimeter();
  else if (G.phase === 'siege') html = G.stage === 'update' ? renderUpdate() : G.stage === 'panel' ? renderPanel() : G.stage === 'event' ? renderEventStage() : G.stage === 'result' || G.stage === 'resolving' ? renderResult() : (() => { throw new Error('estágio inválido: ' + G.stage); })();
  else if (G.phase === 'outcome') html = renderOutcome();
  else if (G.phase === 'post') html = renderPost();
  else throw new Error('fase inválida: ' + G.phase);
  return html + (BAR ? `<div class="actbar" role="region" aria-label="Próximo passo"><div class="actin">${BAR}</div></div>` : '') + cutHTML() + (G && UI.menuConfirm ? menuConfirmModal() : '');
}
/* Tela de falha: o estado não bateu com o esperado. As três saídas funcionam em qualquer estado, e o último ponto salvo continua guardado. */
function renderFatal(err) {
  stopTimer();
  try { console.error('PERÍMETRO: falha ao montar a tela', err); } catch (_) {}
  UI.cut = null; UI.menuConfirm = false; UI.newConfirm = false;
  $app.innerHTML = `<div class="screen"><div class="card fatal" role="alert"><h1 class="h3" style="font-size:20px">Esta tela não pôde ser montada</h1>
    <p class="muted">Algo no estado da partida não bateu com o esperado. O último ponto salvo continua guardado neste navegador.</p>
    <div class="row"><button class="btn primary" data-act="fatalresume">Voltar ao último ponto salvo</button><button class="btn" data-act="fatalmenu">Ir para o menu</button><button class="btn" data-act="fataldrop">Descartar a partida salva</button></div></div></div>`;
  document.body.classList.remove('withbar');
  const b = $app.querySelector('button'); if (b) b.focus({ preventScroll: true });
}
function render() { try { draw(); } catch (err) { renderFatal(err); } }
function draw() {
  const sig = focusSig(document.activeElement);
  const prev = {}; $app.querySelectorAll('[data-k]').forEach(el => { prev[el.dataset.k] = el.dataset.val != null ? el.dataset.val : el.dataset.n; });
  $app.innerHTML = buildScreen();
  document.body.classList.toggle('withbar', !!BAR);
  UI.tabAnim = false;
  const key = G ? G.phase + ':' + (G.stage || '') + ':' + G.round + ':' + UI.post : 'menu', changed = key !== lastKey;
  if (changed) $app.classList.remove('noanim');
  $app.classList.toggle('still', !changed);
  if (changed) { window.scrollTo(0, 0); lastKey = key; }
  // o letreiro segue de onde estava, em vez de recomeçar a cada clique
  $app.querySelectorAll('.tkin').forEach(t => { t.style.animationDelay = `-${(((Date.now() - T0) / 1000) % 60).toFixed(2)}s`; });
  restoreFocus(sig, changed);
  if (!reduceMotion()) tweenChanged(prev);
  const inSiege = G && G.phase === 'siege';
  const edge = document.getElementById('edge');
  if (edge) edge.classList.toggle('hot', !!(inSiege && perceivedAgit().v > 70));
  if (inSiege && G.stage === 'panel') { if (UI.timerRound !== G.round) startTimer(); else tick(); }
  else stopTimer();
  // animação dos medidores do feedback
  requestAnimationFrame(() => requestAnimationFrame(() => document.querySelectorAll('.meter>i[data-to]').forEach(i => { i.style.width = i.dataset.to + '%'; })));
}
$app.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  if (e.detail > 1) return;   // duplo clique: o segundo clique cairia no botão que aparece no mesmo lugar e pularia uma etapa
  if (el.getAttribute('aria-disabled') === 'true') { if (el.dataset.why) warn(el.dataset.why); return; }
  const fn = has(ACT, el.dataset.act) ? ACT[el.dataset.act] : null; if (fn) run(() => fn(el.dataset, el));
});
$app.addEventListener('change', e => {
  const el = e.target.closest('[data-chg]'); if (!el) return;
  const fn = has(CHG, el.dataset.chg) ? CHG[el.dataset.chg] : null; if (fn) run(() => fn(el.value, el.dataset, el));
});
$app.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('g[data-act]')) { e.preventDefault(); e.target.dispatchEvent(new MouseEvent('click', { bubbles: true })); }
});
/* Teclado: foco preso nas janelas modais, Esc para cancelar, 1–3 na carta de evento, setas em abas e na dificuldade. */
document.addEventListener('keydown', e => {
  const modal = $app.querySelector('.cut, .modalback');
  if (e.key === 'Tab' && modal) {
    const f = [...modal.querySelectorAll('button, [href], select, input, [tabindex]:not([tabindex="-1"])')].filter(x => !x.disabled && x.offsetParent !== null);
    if (!f.length) { e.preventDefault(); return; }
    const first = f[0], last = f[f.length - 1], inside = modal.contains(document.activeElement);
    if (e.shiftKey && (document.activeElement === first || !inside)) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && (document.activeElement === last || !inside)) { e.preventDefault(); first.focus(); }
    return;
  }
  if (e.key === 'Escape') {
    if (UI.newConfirm) { e.preventDefault(); ACT.newno(); }
    else if (UI.menuConfirm) { e.preventDefault(); ACT.menuno(); }
    else if (UI.tutor) { e.preventDefault(); ACT.closehowto(); }
    else if (G && G.phase === 'siege' && UI.ivConfirm) { e.preventDefault(); ACT.ivno(); }
    else if (G && G.phase === 'perimeter' && UI.sel) { e.preventDefault(); UI.sel = null; render(); }
    return;
  }
  if (G && G.phase === 'siege' && G.stage === 'event' && /^[1-9]$/.test(e.key) && !e.ctrlKey && !e.metaKey && !e.altKey) {
    const b = $app.querySelector(`.evcard [data-act=evchoice][data-i="${+e.key - 1}"]`); if (b) { e.preventDefault(); b.focus(); b.click(); }
    return;
  }
  const t = e.target, grp = t && t.closest && t.closest('[role=tablist],[role=radiogroup]');
  if (grp && ['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Home', 'End'].includes(e.key)) {
    const items = [...grp.querySelectorAll('[role=tab],[role=radio]')], cur = t.closest('[role=tab],[role=radio]'); let i = items.indexOf(cur); if (i < 0) return;
    const n = items.length; i = e.key === 'Home' ? 0 : e.key === 'End' ? n - 1 : (i + (e.key === 'ArrowLeft' || e.key === 'ArrowUp' ? -1 : 1) + n) % n;
    e.preventDefault(); items[i].focus(); items[i].click();
  }
});
onSaveFail = () => toast('COMANDO', 'Não foi possível salvar a partida neste navegador (armazenamento bloqueado ou cheio). Você pode seguir jogando, mas ela não será retomada se a página for recarregada.', 'warn');
/* O relógio da rodada espera com a aba oculta, e o que sobrava dele é salvo ao sair da página (recarregar continua de onde parou). */
document.addEventListener('visibilitychange', () => { if (document.hidden) pauseTimer(); else resumeTimer(); });
window.addEventListener('pagehide', () => { if (G && UI.timerId) G.tleft = timeLeft(); saveGame(); });
window.PERIMETRO = { get G() { return G; }, newGame, startRound, resolveDecisions, chooseEvent, finishRound, addDecision, computeScore, zoneCoverage, intervProb, negoParts, autoPlace, confirmPerimeter, render, ACT, UI };
render();
</script>
